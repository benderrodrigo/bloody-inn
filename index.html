  });
  g.font = '17px sans-serif'; g.fillStyle = '#8c7c62';
  g.fillText(`${S.n} player${S.n === 1 ? '' : 's'} \u00B7 ${S.opts.long ? 'long' : 'short'} game \u00B7 ${S.round} rounds \u00B7 v${APP_VERSION} \u00B7 benderrodrigo.github.io/bloody-inn`, 44, H - 36);
  return cv;
}
function showShare() {
  const cv = scorecard(), url = cv.toDataURL('image/png');
  const canShare = !!(navigator.canShare && navigator.share);
  modal({title: 'Share result', dock: false, body: `<img class="scorecard" src="${url}" alt="Scorecard image of this game">`, buttons: [
    ...(canShare ? [{label: '\u{1F4E4} Share', cls: 'primary', keep: true, fn: () => cv.toBlob(b => {
      const f = new File([b], 'bloody-inn-result.png', {type: 'image/png'});
      (navigator.canShare({files: [f]}) ? navigator.share({files: [f], title: 'The Bloody Inn result'}) : navigator.share({title: 'The Bloody Inn result'})).catch(() => {});
    })}] : []),
    {label: '\u2B07\uFE0F Save image', cls: canShare ? '' : 'primary', keep: true, fn: () => { const a = document.createElement('a'); a.href = url; a.download = 'bloody-inn-result.png'; a.click(); }},
    {label: 'Back to results', fn: showResult}]});
}

// ---------- guided tour on a practice game ----------
const TOUR = [
  {sel: '.top', t: 'Welcome to the inn', b: 'The top bar shows whose decision it is, the round and how many travelers are left, a police warning when a policeman is in the inn, and everyone\u2019s money: cash (max 40F) plus checks.'},
  {sel: '.inn .rooms', t: 'The rooms', b: 'Each round the first player lodges a traveler in every open room. The key shows who owns the room: you earn 1F per occupied room of your colour when the guests leave. Tap a traveler to see what bribing or killing him costs.'},
  {sel: '.boardwrap', t: 'Wealth Track and bistro', b: 'The discs on the board show everyone\u2019s cash. Peasants drink at the bistro: bribe one or two for free, or kill one. Tap \u2922 to enlarge the board.'},
  {sel: '.tableau', t: 'Your hand, annexes and corpses', b: 'Accomplices in your hand pay for actions: a card whose aptitude matches the action comes back. Annexes hold as many corpses as their rank; your barn holds one. Unburied corpses cost 10F each when the police investigate.'},
  {sel: '.side .prompt', sheet: true, t: 'Try it: take an action', b: 'Pick something lit up: a traveler to bribe or kill, a card in your hand to build, or Pass. The panel suggests a payment and previews the money; tap Confirm.', wait: T => UI.S.log.slice(T.log0).some(l => l.p === 0 && ['bribe', 'kill', 'build', 'bury', 'pass'].includes(l.kind))},
  {sel: '.side .panelrest', sheet: true, t: 'Players, Journal and Rival intel', b: 'Players lists everyone\u2019s hand, annexes and corpses (tap a name for details). The Journal tells every move; Rival intel hints at what your rivals are up to.'},
  {sel: '.menubtn', t: 'Menu and shortcuts', b: 'Sound, animations, card art and opponent speed are in the menu. On a keyboard, press ? for shortcuts. That is the tour: play on, or start a real game from the menu.'}];
function tourStart() {
  closeModal();
  const back = UI.S && !UI.S.over && !UI.practice ? {S: UI.S, undo: UI.undo, viewer: UI.viewer, tab: UI.tab, seasonSnap: UI.seasonSnap, sheetMin: UI.sheetMin} : null;
  clearTimeout(UI.timer); UI.gen++;
  UI.practice = true;
  const seats = [{name: 'You', type: 'human', level: 'normal'}, {name: 'Anna', type: 'ai', level: 'easy'}];
  const S = Engine.newGame({seed: 4242, long: false, seats});
  let g = 0;
  while (S.pending && (S.pending.t !== 'turn' || S.pending.p !== 0) && g++ < 40) Engine.apply(S, AI.decide(S, 'easy'));
  UI.S = S;
  UI.undo = []; UI.viewer = 0; UI.tab = 'players'; UI.hold = false; UI.kcur = null; UI.sel = null; UI.seasonSnap = snap(UI.S);
  UI.tour = {i: 0, back, log0: 0};
  document.body.insertAdjacentHTML('beforeend', `<div id="tour"><div class="spot"></div><div class="tcard" role="dialog" aria-live="polite"></div></div>`);
  $('#tour .tcard').addEventListener('click', e => {
    const b = e.target.closest('[data-tour]'); if (!b) return;
    const k = b.dataset.tour;
    if (k === 'skip') return tourEnd(true);
    tourGo(UI.tour.i + (k === 'next' ? 1 : -1));
  });
  addEventListener('resize', tourPlace);
  renderGame(); next(); tourGo(0);
}
function tourGo(i) {
  const T0 = UI.tour; if (!T0) return;
  if (i >= TOUR.length) return tourEnd(true);
  T0.i = Math.max(0, i);
  const st = TOUR[T0.i];
  if (st.wait) T0.log0 = UI.S.log.length;
  if (st.sheet) { UI.sheetMin = false; UI.tab = 'players'; }
  renderGame();
}
function tourPlace() {
  const T0 = UI.tour, box = $('#tour'); if (!T0 || !box) return;
  const st = TOUR[T0.i], el = $(st.sel), spot = $('.spot', box), card = $('.tcard', box);
  T0.waiting = !!(st.wait && !st.wait(T0));
  card.innerHTML = `<div class="tstep">Step ${T0.i + 1} of ${TOUR.length}</div><h3>${st.t}</h3><p>${st.b}</p>${st.wait ? `<p class="${T0.waiting ? 'twait' : 'tdone'}">${T0.waiting ? '\u23F3 Waiting for your move\u2026' : '\u2714 Nicely done.'}</p>` : ''}
    <div class="tbtns"><button data-tour="skip" class="ghost">${T0.i === TOUR.length - 1 ? 'Close' : 'Skip tour'}</button><span class="spacer"></span><button data-tour="back" ${T0.i ? '' : 'disabled'}>Back</button><button data-tour="next" class="primary" ${T0.waiting ? 'disabled' : ''}>${T0.i === TOUR.length - 1 ? 'Finish' : 'Next'}</button></div>`;
  if (!el) { spot.hidden = true; card.style.left = '50%'; card.style.top = '30%'; card.style.transform = 'translateX(-50%)'; return; }
  const r = el.getBoundingClientRect(), pad = 6;
  Object.assign(spot.style, {left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px'}); spot.hidden = false;
  const cw = Math.min(340, innerWidth - 20), ch = card.offsetHeight || 200;
  card.style.width = cw + 'px'; card.style.transform = '';
  let x = r.left + r.width / 2 - cw / 2, y = r.bottom + 14;
  if (y + ch > innerHeight - 8) y = r.top - ch - 14;
  if (y < 8) { y = Math.max(8, Math.min(innerHeight - ch - 8, r.top + 20)); x = r.right + 14 + cw < innerWidth ? r.right + 14 : r.left - cw - 14; }
  card.style.left = Math.max(10, Math.min(innerWidth - cw - 10, x)) + 'px'; card.style.top = Math.max(8, y) + 'px';
}
function tourEnd(restore) {
  const T0 = UI.tour; if (!T0) return;
  UI.tour = null; store.set('tourDone', true);
  removeEventListener('resize', tourPlace);
  const box = $('#tour'); if (box) box.remove();
  if (!restore) { UI.practice = false; return; }
  if (T0.back) {
    clearTimeout(UI.timer); UI.gen++; closeModal(); UI.practice = false;
    Object.assign(UI, {S: T0.back.S, undo: T0.back.undo, viewer: T0.back.viewer, tab: T0.back.tab, seasonSnap: T0.back.seasonSnap, sheetMin: T0.back.sheetMin, hold: false, sel: null});
    renderGame(); next(); toast('Back to your game');
  } else { renderGame(); toast('Practice game: play on, it is not saved or counted.\nStart a real game from the menu.', 3200); }
}

// ---------- ?test, ?selfplay, ?freeze ----------
function runTests() {
  const res = Tests.run(), pass = res.filter(x => x.ok).length;
  document.title = `TESTS ${pass}/${res.length}`;
  $('#app').innerHTML = `<div class="testlist"><h2>TESTS ${pass}/${res.length}</h2><p>${pass} passed, ${res.length - pass} failed</p>${res.map(x => `<div class="${x.ok ? 'p' : 'f'}">${x.ok ? '\u2713' : '\u2717'} ${esc(x.name)}${x.ok ? '' : '\n   ' + esc(x.msg)}</div>`).join('')}</div>`;
}
function selfplaySeats() {
  const sv = Q.get('seats') || '4', levels = (Q.get('levels') || 'normal').split(',');
  const n = sv === 'solo' ? 1 : +sv;
  return Array.from({length: n}, (_, i) => ({name: i ? AI_NAMES[i - 1] : 'You', type: i && Q.get('pnp') !== '1' ? 'ai' : 'human', level: levels[i % levels.length]}));
}
function runSelfplay() {
  const games = +(Q.get('n') || 1), seed0 = +(Q.get('seed') || 1000), long = Q.get('short') !== '1';
  let steps = 0, last = '';
  UI.auto = true;
  try {
    for (let g = 0; g < games; g++) {
      UI.S = Engine.newGame({seed: seed0 + g, long, seats: selfplaySeats(), unlimited: Q.get('unlimited') === '1', fcfs: Q.get('fcfs') === '1'}); UI.undo = []; UI.viewer = 0;
      let k = 0;
      while (!UI.S.over) {
        if (++k > 6000) throw new Error('stalled at seed ' + (seed0 + g));
        const p = actor(UI.S);
        if (pnp()) UI.viewer = p;
        const m = AI.decide(UI.S, seat(p).level);
        const err = Engine.check(UI.S, m);
        if (err) throw new Error(`illegal move ${JSON.stringify(m)}: ${err}`);
        commit(m, isHuman(p));
        if (k % 23 === 0) renderGame();
      }
      steps += k;
      last = UI.S.result.rows.map(r => r.total).join('/');
    }
    UI.auto = false; renderGame();
    document.title = `SELFPLAY DONE ${last} in ${steps} steps`;
  } catch (e) {
    UI.auto = false;
    document.title = `SELFPLAY ERROR ${e.message}`;
    $('#app').insertAdjacentHTML('afterbegin', `<pre class="testlist f">${esc(e.stack || e)}</pre>`);
  }
}
function runFreeze() {
  const o = {...defaultSetup(), n: Q.get('seats') === 'solo' ? 1 : +(Q.get('seats') || 4), opp: Q.get('opp') || 'normal', long: Q.get('short') !== '1'};
  startGame(o, +(Q.get('seed') || 7));
  clearTimeout(UI.timer);
  const turns = +(Q.get('turns') || 0);
  UI.auto = true;
  for (let k = 0; k < turns && !UI.S.over; k++) commit(AI.decide(UI.S, 'normal'), false);
  let g = 0;
  const want = Q.get('until') || 'turn';
  while (!UI.S.over && g++ < 3000 && (!isHuman(actor(UI.S)) || (want !== 'any' && UI.S.pending.t !== want) || (Q.has('end') && !UI.S.over))) commit(AI.decide(UI.S, 'normal'), false);
  UI.auto = false; UI.undo = [];
  if (Q.get('tab')) UI.tab = Q.get('tab');
  if (Q.has('sheet')) UI.sheetMin = Q.get('sheet') === 'min';
  renderGame();
  const pop = Q.get('popup');
  const S = UI.S, myP = S.pending && S.pending.p;
  if (pop === 'help') showHelp();
  if (pop === 'menu') showMenu();
  if (pop === 'keys') showKeys();
  if (pop === 'stats') { if (S.over) recordStats(S); showStats(); }
  if (pop === 'result' && S.over) showResult();
  if (pop === 'share' && S.over) showShare();
  if (pop === 'exit') showExit();
  if (pop === 'board') showBoard();
  if (pop === 'player') showPlayer(1);
  if (pop === 'card') { const i = S.rooms.findIndex(R => R.guest); if (i >= 0) showCard(S.rooms[i].guest); }
  if (pop === 'season') { UI.seasonSnap = snap(S).map(x => ({...x, total: x.total - 12, annexes: Math.max(0, x.annexes - 1)})); showSeason(S); }
  if (pop === 'tour') { UI.freeze = false; tourStart(); UI.freeze = true; clearTimeout(UI.timer); tourGo(+(Q.get('tstep') || 1) - 1); }
  if (pop === 'choose' && myTurn()) { const o2 = Engine.options(S, myP), i = o2.kill.find(x => o2.bribe.includes(x)) ?? o2.bribe[0]; if (i !== undefined) onRoom(i); }
  if (pop === 'pay' && myTurn()) { const o2 = Engine.options(S, myP), i = o2.bribe.find(x => Engine.cost(S, myP, {t: 'bribe', rooms: [x]}) > 0) ?? o2.bribe[0]; if (i !== undefined) { onRoom(i); onOpt('bribe'); } }
  if (pop === 'build' && myTurn()) { const id = Engine.options(S, myP).build[0]; if (id) onHand(id); }
  if (pop === 'pass' && myTurn()) onOpt('pass');
  if (pop === 'cursor') { const el = cursorTargets()[+(Q.get('k') || 0)]; if (el) { UI.kcur = {a: el.dataset.a, v: el.dataset.i || el.dataset.id || ''}; renderGame(); } }
  if (pop === 'preview') { const el = $('.room.tgt'); if (el) { const r = el.getBoundingClientRect(); tipShow(el, r.left + r.width / 2, r.top + r.height / 2); el.classList.add('kcur'); } }
  document.title = `FROZEN round ${S.round} ${S.pending ? S.pending.t : 'over'}`;
}

// ?uitest: play whole games through DOM clicks only; each human move must equal the engine applying the same move.
async function runUiTest() {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let clicks = 0, moves = 0, last = '';
  const click = (el, what) => { if (!el) throw new Error('missing ' + what); el.dispatchEvent(new MouseEvent('click', {bubbles: true})); clicks++; };
  const room = i => $(`.room[data-i="${i}"]`), hand = id => $(`.tableau [data-a="hand"][data-id="${id}"]`), opt = o => $(`.prompt [data-o="${o}"]`);
  const fixPay = want => {
    for (const id of UI.sel.pay.filter(x => !want.includes(x))) click(hand(id), 'pay card ' + id);
    for (const id of want.filter(x => !UI.sel.pay.includes(x))) click(hand(id), 'pay card ' + id);
  };
  async function play(m) {
    switch (m.t) {
      case 'lodge': case 'rs': case 'monk': return click(room(m.room), 'room ' + m.room);
      case 'grave': return click(opt('grave:' + m.checks), 'grave option');
      case 'release':
        for (const id of UI.sel.ids.filter(x => !m.ids.includes(x))) click(hand(id), 'release card');
        for (const id of m.ids.filter(x => !UI.sel.ids.includes(x))) click(hand(id), 'release card');
        return click(opt('release'), 'release button');
      case 'pass':
        click(opt('pass'), 'pass');
        for (let k = 0; k < Math.abs(m.launder || 0); k++) click(opt(m.launder > 0 ? 'k+' : 'k-'), 'launder');
        return click(opt('confirm'), 'confirm pass');
      case 'peasants': click($('.stack.bist'), 'bistro'); return click(opt('peas:' + m.n), 'peasants');
      case 'killPeasant': click($('.stack.bist'), 'bistro'); return click(opt('killpeas'), 'kill peasant');
      case 'bribe': case 'kill':
        click(room(m.rooms[0]), 'room'); click(opt(m.t), m.t);
        for (const r of m.rooms.slice(1)) click(room(r), 'extra room');
        fixPay(m.pay); return click(opt('confirm'), 'confirm');
      case 'build': click(hand(m.card), 'build card'); fixPay(m.pay); return click(opt('confirm'), 'confirm');
      case 'bury':
        m.items.forEach((it, k) => {
          click($(`.tableau [data-a="corpse"][data-id="${it.id}"]`), 'corpse');
          if (k === 0 || UI.sel.items.length === k + 1) click($(`.prompt [data-a="dest"][data-p="${it.owner}"][data-i="${it.annex}"]`), 'annex ' + it.owner + '/' + it.annex);
        });
        fixPay(m.pay); return click(opt('confirm'), 'confirm');
    }
    throw new Error('no UI path for ' + m.t);
  }
  UI.aiSpeed = 'fast'; UI.anim = false;
  try {
    for (let g = 0; g < +(Q.get('n') || 1); g++) {
      const n = Q.get('seats') === 'solo' ? 1 : +(Q.get('seats') || 3);
      startGame({...defaultSetup(), n, opp: Q.get('pnp') === '1' ? 'pnp' : 'normal', long: Q.get('short') !== '1'}, +(Q.get('seed') || 2000) + g);
      let guard = 0;
      while (!UI.S.over) {
        if (++guard > 20000) throw new Error('stalled');
        await wait(5);
        const cc = $('.chcard'); if (cc) { click(cc, 'season card'); continue; }
        const ps = $('#passok'); if (ps) { click(ps, 'pass device'); continue; }
        if (!myTurn()) continue;
        const before = UI.S, m = AI.decide(before, 'normal'), want = structuredClone(before);
        Engine.apply(want, m);
        await play(m);
        if (UI.S.done) want.done = true;
        if (UI.S === before) throw new Error('UI did not commit ' + JSON.stringify(m) + ' sel ' + JSON.stringify(UI.sel));
        if (JSON.stringify(UI.S) !== JSON.stringify(want)) {
          const diff = (a, b, path) => {
            if (JSON.stringify(a) === JSON.stringify(b)) return null;
            if (a && b && typeof a === 'object' && typeof b === 'object') for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) { const d = diff(a[k], b[k], path + '.' + k); if (d) return d; }
            return `${path}: ui ${JSON.stringify(a)} vs engine ${JSON.stringify(b)}`.slice(0, 300);
          };
          throw new Error('UI state differs after ' + JSON.stringify(m) + ' at ' + diff(UI.S, want, 'S'));
        }
        moves++;
      }
      await wait(1200); closeModal();
      last = UI.S.result.rows.map(r => r.total).join('/');
    }
    document.title = `UITEST DONE ${moves} moves ${clicks} clicks, last ${last}`;
  } catch (e) {
    document.title = `UITEST ERROR ${e.message}`.slice(0, 400);
    $('#app').insertAdjacentHTML('afterbegin', `<pre class="testlist f">${esc(e.stack || e)}</pre>`);
  }
}

function boot() {
  if (Q.has('uitest')) return runUiTest();
  if (Q.has('test')) return runTests();
  if (Q.has('selfplay')) return runSelfplay();
  if (UI.freeze) return runFreeze();
  landing();
}
boot();
