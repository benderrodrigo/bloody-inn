<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#120d0b">
<title>The Bloody Inn</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Bloody Inn">
<meta name="description" content="Unofficial fan implementation of The Bloody Inn for personal play. Works offline.">
<style>
:root {
  --bg: #120d0b; --panel: #1d1511; --panel2: #271c16; --line: #3d2d22; --ink: #efe3c4; --muted: #a8977a; --gold: #e0b850; --blood: #b3161b; --ok: #5fbf6a;
  --fc: Georgia, 'Times New Roman', serif; --fs: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --top: 52px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--fs); -webkit-tap-highlight-color: transparent; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover:not([disabled]) { border-color: #6b513c; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button[disabled] { opacity: .45; cursor: not-allowed; }
button.primary { background: linear-gradient(#a11a1a, #7a1010); border-color: #c33; color: #fff4e4; font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; }
a { color: var(--gold); }
.muted { color: var(--muted); } .bad { color: #ff7b6b; }
h1, h2, h3 { font-family: var(--fc); font-weight: 700; margin: 0; }
.cfont { font-family: Georgia, serif; }
.spacer { flex: 1; }
kbd { background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 5px; padding: 1px 6px; font: 13px var(--fs); }
.toast { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); background: rgba(20, 12, 10, .95); border: 1px solid var(--gold); padding: 10px 16px; border-radius: 10px; z-index: 90; white-space: pre-line; text-align: center; max-width: 90vw; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; transform: translate(-50%, 8px); } }

.landing .box { padding: 28px 26px; background: var(--panel); border-left: 1px solid var(--line); }
.landing h1 { font-size: 34px; color: #f3dfb5; letter-spacing: .5px; }
.landing .sub { color: var(--muted); font-style: italic; margin: 2px 0 18px; }
.field { margin: 12px 0; } .field > label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; } .seg button { flex: 1; padding: 7px 6px; } .seg button.on { background: #5a1212; border-color: #c33; }
label.check { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; color: var(--ink); font-size: 14px; } label.check input { margin-top: 3px; accent-color: var(--blood); }
details.seats summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.seatrow { display: flex; gap: 6px; align-items: center; margin: 6px 0; } .seatrow i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); flex: none; border: 2px solid #000; }
.seatrow input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
.seatrow select, .menu select { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; } .row button { flex: 1; }
.tourhint { font-size: 13px; color: var(--muted); }
.foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
.l-ver { position: fixed; left: 12px; bottom: 6px; margin: 0; font-size: 12px; color: var(--muted); }
.l-ver button { padding: 1px 6px; font-size: 12px; background: transparent; border-color: var(--line); color: var(--muted); }
@media (max-width: 759px) { .landing { grid-template-columns: 1fr; } .landing .art { min-height: 34vh; } .landing .box { border-left: 0; padding-bottom: 46px; } .l-ver { position: static; padding: 0 0 14px 26px; background: var(--panel); } }

/* ---------- top bar ---------- */
.top { height: var(--top); display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #0c0806; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; position: relative; z-index: 5; }
.top::-webkit-scrollbar { display: none; }
.top > * { flex: none; } .top button { padding: 5px 9px; }
.top .title { font-family: var(--fc); font-weight: 700; color: #f3dfb5; margin-right: 4px; }
.menubtn { padding: 4px 6px !important; display: flex; }
.tpill { display: inline-flex; align-items: center; gap: 5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.tpill small { color: var(--muted); font-size: 11px; } .tpill em { color: #ff7b6b; font-style: normal; font-weight: 700; }
.tpill.turn i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.tpill .bar { width: 46px; height: 5px; background: #000; border-radius: 3px; overflow: hidden; } .tpill .bar i { display: block; height: 100%; background: var(--gold); }
.tpill.cops { border-color: #c33; background: #3a0f0f; animation: copglow 1.6s infinite; }
@keyframes copglow { 50% { box-shadow: 0 0 10px #f33; } }
.money { position: relative; display: inline-flex; align-items: center; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px 3px 5px; font-size: 13px; }
.money i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); border: 2px solid #000; }
.money.big { font-size: 15px; border-color: var(--pc); } .money.act { box-shadow: 0 0 0 2px var(--pc); }
.money small { color: var(--muted); font-size: 11px; } .money .chk { font-size: 12px; }
.delta { position: absolute; right: -2px; top: -4px; font-weight: 800; font-size: 13px; animation: rise 1.7s forwards; pointer-events: none; text-shadow: 0 1px 2px #000; }
.delta.up { color: #8f8; } .delta.dn { color: #f88; }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-16px); opacity: 0; } }

/* ---------- main layout ---------- */
.main { display: grid; grid-template-columns: 1fr minmax(310px, 370px); height: calc(100vh - var(--top)); height: calc(100dvh - var(--top)); }
.play { overflow: auto; padding: 10px; }
.side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.side .grab { display: none; }
.panelrest { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.tabs { display: flex; border-bottom: 1px solid var(--line); } .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 9px 4px; }
.tabs button.on { color: var(--ink); box-shadow: inset 0 -3px var(--blood); }
.tabbody { overflow: auto; padding: 8px 10px 16px; flex: 1; }

/* ---------- inn ---------- */
.inn { max-width: 1100px; margin: 0 auto; }
.rooms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.room { background: #241914; border: 2px solid var(--line); border-radius: 10px; padding: 4px; cursor: pointer; position: relative; transition: transform .12s; }
.room.shut { opacity: .4; }
.room .door { display: flex; align-items: center; gap: 4px; font-size: 12px; min-height: 22px; padding: 0 2px 3px; }
.room .door b { font-family: var(--fc); font-size: 14px; color: #f3dfb5; }
.keychip, .rschip { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 18px; border-radius: 4px; background: var(--c); border: 1px solid #000; font-size: 11px; }
.closed { color: var(--muted); font-size: 11px; } .cop { margin-left: auto; font-size: 15px; animation: copglow 1.6s infinite; border-radius: 50%; }
.slot { aspect-ratio: 100 / 140; display: flex; }
.slot .card, .hc .card, .annex .card, .stack .card, .pcard .card { width: 100%; height: auto; display: block; }
.empty { flex: 1; border: 2px dashed #4a372a; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.tgt { outline: 3px solid var(--gold); outline-offset: 1px; box-shadow: 0 0 14px rgba(224, 184, 80, .55); animation: pulse 1.6s infinite; }
.room.tgt:hover, .hc.tgt:hover { transform: translateY(-2px); }
.chosen { outline: 3px solid #ff4a3a !important; box-shadow: 0 0 16px rgba(255, 60, 40, .6) !important; animation: none; }
.kcur { outline: 3px dashed #7fd3ff !important; outline-offset: 3px; }
@keyframes pulse { 50% { box-shadow: 0 0 4px rgba(224, 184, 80, .25); } }
.fl { animation: flash 1.1s; } @keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px #fff3b0, 0 0 22px #ffd24a; } }
.noanim *, .noanim *::before { animation: none !important; transition: none !important; }
.mid { display: grid; grid-template-columns: 74px 1fr 74px; gap: 8px; align-items: center; margin: 8px 0; }
.boardwrap { position: relative; } .boardwrap svg { width: 100%; height: auto; display: block; border-radius: 8px; }
.bigb { position: absolute; right: 4px; top: 4px; padding: 0 6px !important; background: rgba(0, 0, 0, .55) !important; z-index: 1; }
.board .bistro { cursor: pointer; } .board .bistro.tgt { animation: none; outline: none; box-shadow: none; }
.stack { position: relative; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; }
.stack .cnt { position: absolute; top: 2px; right: 2px; background: #000; border: 1px solid var(--gold); border-radius: 999px; font-size: 12px; padding: 0 6px; font-weight: 700; }
.stack .lab { font-size: 11px; color: var(--muted); } .stack .big { font-size: 28px; line-height: 1.2; }
.stack .empty { width: 100%; min-height: 60px; font-size: 10px; }
.stk2 { display: flex; flex-direction: column; gap: 6px; }
.exitbars { display: flex; gap: 2px; align-items: flex-end; height: 40px; width: 100%; padding: 0 4px; } .exitbars i { flex: 1; background: var(--c); height: var(--h); min-height: 2px; border-radius: 2px 2px 0 0; }
.bigboard svg { width: 100%; height: auto; }
@media (max-width: 520px) { .mid { grid-template-columns: 52px 1fr 52px; gap: 4px; } .rooms { gap: 4px; } .room { padding: 2px; border-radius: 7px; } .room .door { font-size: 10px; } .keychip, .rschip { width: 18px; height: 15px; font-size: 9px; } }

/* ---------- tableau ---------- */
.tableau { max-width: 1100px; margin: 12px auto 0; border-top: 3px solid var(--pc); padding-top: 6px; }
.trow h3 { font-size: 14px; color: #f3dfb5; margin: 6px 0 4px; } .trow h3 small { color: var(--muted); font-family: var(--fs); font-weight: 400; font-size: 12px; margin-left: 6px; }
.trow.warn h3 { color: #ff8a7a; }

<body>
<div id="app"></div>
<script>
// ===== Static game data: card types, deck sizes, board coordinates. =====
// Card types. id | name | colour | rank | pocket money (F) | copies | annex | effect key | annex text
const TYPES_TXT = `
newsboy|Newsboy|blue|0|8|4|Kiosk|kiosk|Immediately earn 1F per blue annex you have built, including this one.
representative|Representative|blue|1|12|4|Parlor|parlor|From now on, play 1 accomplice fewer to perform the Bribe a Guest action.
concierge|Concierge|blue|2|18|3|Room Service|roomservice|Immediately place a Room Service token next to a Key token. From now on, when a Guest rents this room, he immediately pays a sum equal to his rank.
grocer|Grocer|blue|3|26|1|Grocery|grocery|Immediately earn 4F. At the end of the game, earn 4F per blue card in the Exit Stack.
shopkeeper|Shopkeeper|blue|3|26|1|Store|store|From now on, you can bribe as many travelers as you want in one Bribe a Guest action.
brewer|Brewer|blue|3|26|1|Brewery|brewery|From now on, you can bribe up to four peasants simultaneously in one Bribe a Guest action.
cultivator|Cultivator|red|0|8|4|Vegetable Garden|vegetable|Immediately earn 1F per red annex you have built, including this one.
mechanic|Mechanic|red|1|12|4|Workshop|workshop|From now on, play 1 accomplice fewer to perform the Build an Annex action.
distiller|Distiller|red|2|18|3|Distillery|distillery|At the end of each round, do not pay the wages for one of the accomplices in your hand.
landscaper|Landscaper|red|3|26|1|Park|park|Immediately earn 4F. At the end of the game, earn 4F per red card in the Exit Stack.
gardener|Gardener|red|3|26|1|Gardens|gardens|At the end of each round, earn an additional 2F during the Travelers Leave phase.
butcher|Butcher|red|3|26|1|Butcher's Shop|butcher|From now on, you can kill as many travelers as you want in one Kill a Guest action.
novice|Novice|purple|0|8|4|Altar|altar|Immediately earn 1F per purple annex you have built, including this one.
monk|Monk|purple|1|12|4|Room|room|Immediately replace one of the white Key tokens with one of your Key tokens.
abbot|Abbot|purple|2|18|3|Cellar|cellar|From now on, play 1 accomplice fewer to perform the Bury a Corpse action.
priest|Priest|purple|3|26|1|Chapel|chapel|From now on, you are not required to discard accomplices of the other types when you use them for a Bury a Corpse action.
bishop|Bishop|purple|3|26|1|Bishopric|bishopric|Immediately earn 4F. At the end of the game, earn 4F per purple card in the Exit Stack.
archbishop|Archbishop|purple|3|26|1|Crypt|crypt|From now on, you can bury as many corpses as you want in one Bury a Corpse action.
baron|Baron|green|0|8|4|Large Chandelier|chandelier|Immediately earn 4F.
viscount|Viscount|green|1|12|4|King Size Bed|bed|Immediately earn 6F.
count|Count|green|2|18|3|Dining Room|dining|Immediately earn 9F.
duke|Duke|green|3|26|1|Stables|stables|Immediately earn 4F. At the end of the game, earn 4F per green card in the Exit Stack.
marquis|Marquis|green|3|26|1|Detached House|detached|Immediately earn 18F.
prince|Prince|green|3|26|1|Greenhouse|greenhouse|At the end of the game, earn 3F per check you have.
peacekeeper|Peacekeeper|grey|0|8|4|||
brigadier|Brigadier|grey|1|12|4|||
chief|Brigadier Chief|grey|2|18|3|||
major|Major|grey|3|26|3|||
peasant|Peasant|yellow|0|4|8|||
`;
const TYPES = {};
for (const line of TYPES_TXT.trim().split('\n')) {
  const [id, name, color, rank, money, count, annex, effect, text] = line.split('|');
  TYPES[id] = {id, name, color, rank: +rank, money: +money, count: +count, annex: annex || null, effect: effect || null, text: text || ''};
}
// Card instances: newsboy1..newsboy4, peasant1..peasant8 (1-4 one illustration, 5-8 the other).
const CARDS = {};
for (const t of Object.values(TYPES)) for (let i = 1; i <= t.count; i++) CARDS[t.id + i] = {id: t.id + i, type: t.id};
const T = id => TYPES[CARDS[id].type];
const TRAVELER_IDS = Object.keys(CARDS).filter(id => CARDS[id].type !== 'peasant');
const PEASANT_IDS = Object.keys(CARDS).filter(id => CARDS[id].type === 'peasant');
const artFront = id => CARDS[id].type === 'peasant' ? (+id.slice(7) <= 4 ? 'peasantA' : 'peasantB') : CARDS[id].type;

const COLORS = ['blue', 'red', 'purple', 'green', 'grey', 'yellow'];
const COLOR_NAMES = {blue: 'merchant', red: 'artisan', purple: 'religious', green: 'noble', grey: 'police', yellow: 'peasant'};
// Aptitude: cards of this colour return to hand when played for that action.
const APTITUDE = {blue: 'bribe', red: 'build', grey: 'kill', purple: 'bury'};
const ACTIONS = ['bribe', 'build', 'kill', 'bury', 'pass'];
const ACTION_NAMES = {bribe: 'Bribe a Guest', build: 'Build an Annex', kill: 'Kill a Guest', bury: 'Bury a Corpse', pass: 'Pass'};

// Setup table (player aid back): cards returned to the box, by player count.
const REMOVE = {1: {short: 34, long: 26}, 2: {short: 35, long: 25}, 3: {short: 28, long: 16}, 4: {short: 22, long: 6}};
const NEUTRAL_KEYS = {1: 3, 2: 3, 3: 3, 4: 4};
const START_CASH = 5, START_CHECKS = 1, CASH_CAP = 40, BARN_RANK = 1;
const SEAT_COLORS = ['red', 'green', 'blue', 'yellow'];
const SEAT_HEX = {red: '#b8322a', green: '#2f8a45', blue: '#2f64b0', yellow: '#d8a51c', white: '#ece6d6'};
const SOLO_RATINGS = [[170, 'demonic innkeeper'], [150, 'evil innkeeper'], [130, 'hazardous innkeeper'], [110, 'worrying innkeeper'], [0, 'apprentice innkeeper']];

// Board (photos/20261101_132430.jpg flattened by _work/board_warp.py), units: 1000 x 324.
// Wealth Track: space | x,y
const TRACK_TXT = `0|85,130 1|113,91 2|156,91 3|202,91 4|248,91 5|296,91 6|342,91 7|388,91 8|436,91 9|483,91 10|531,91 11|579,91 12|625,91 13|672,91
14|714,120 15|670,152 16|623,152 17|577,152 18|530,152 19|483,152 20|437,152 21|390,152 22|342,152 23|297,152 24|250,152 25|203,152 26|156,152
27|116,185 28|156,220 29|204,220 30|250,220 31|297,220 32|343,220 33|390,220 34|438,220 35|483,220 36|532,220 37|579,220 38|625,220 39|672,220 40|722,220`;
const BOARD = {w: 1000, h: 324, r: 22, track: [], doors: [], bistro: {x: 808, y: 48, w: 140, h: 230}, entrance: {x: 26, y: 152}, exit: {x: 975, y: 152}};
for (const tok of TRACK_TXT.split(/\s+/)) { const [n, xy] = tok.split('|'); const [x, y] = xy.split(',').map(Number); BOARD.track[+n] = {x, y}; }
// Room doors 1-8: x,y of the number plaque (1-4 top edge, 5-8 bottom edge).
const DOORS_TXT = `154,14 325,14 492,14 660,14 156,310 328,310 502,310 672,310`;
BOARD.doors = DOORS_TXT.split(' ').map(s => { const [x, y] = s.split(',').map(Number); return {x, y}; });

// ===== Rules engine: state in, legal actions and new state out. No DOM access. =====
const APP_VERSION = '0.1';
const CHANGELOG = [
  {v: '0.1', date: '2026-11-01', items: [
    'Full base game of The Bloody Inn: 70 travelers, 8 peasants, two seasons, short and long games.',
    'Seats for 1 to 4 players: you against AI innkeepers (Easy, Normal, Hard), pass and play, or the solo game with its innkeeper ratings.',
    'Variants: Unlimited Wealth and First Come, First Served.',
    'Bribe, build, kill, bury and launder with a tap: legal targets light up, payments are suggested, and Undo works until a new card is drawn.',
    'Move previews, rival intel, journal, statistics, a guided tour, keyboard shortcuts and an end-of-game reveal you can share.',
    'Phone, fold and laptop layouts; sound and animations you can switch off; installs as an app and plays offline.',
    'Real card and board art in your own copy; built-in rule tests (?test), self-play (?selfplay) and a board overlay (?debug).',
  ]},
];

const Engine = (() => {
  // ---------- helpers ----------
  function rnd(S) {
    let t = (S.rng = (S.rng + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function shuffle(S, a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const pname = (S, p) => (S.seats[p] && S.seats[p].name) || `Player ${p + 1}`;
  function log(S, text, kind = '', p = null, extra) {
    if (S.sim) return;
    S.log.push({round: S.round, p, text, kind, ...extra});
  }
  const rank = id => T(id).rank;
  const color = id => T(id).color;
  const isPolice = id => color(id) === 'grey';
  const isPeasant = id => CARDS[id].type === 'peasant';
  const canAnnex = id => !!T(id).annex;
  const count = (P, eff) => P.annexes.reduce((n, a) => n + (a.id !== 'barn' && T(a.id).effect === eff ? 1 : 0), 0);
  const colorAnnexes = (P, col) => P.annexes.filter(a => a.id !== 'barn' && color(a.id) === col).length;
  const annexRank = a => a.id === 'barn' ? BARN_RANK : rank(a.id);
  const annexFree = a => annexRank(a) - a.under.length;
  const order = S => Array.from({length: S.n}, (_, i) => (S.first + i) % S.n);
  const guestsInInn = S => S.rooms.filter(r => r.guest).length;
  const openRooms = S => S.rooms.map((r, i) => r.key !== null ? i : -1).filter(i => i >= 0);
  const wealth = P => P.cash + 10 * P.checks;
  const buriedUnder = P => P.annexes.reduce((n, a) => n + a.under.length, 0);
  const keysOf = (S, p) => S.rooms.filter(r => r.key === p).length;

  function gain(S, p, amt) {
    if (amt <= 0) return 0;
    const P = S.players[p];
    if (S.opts.unlimited) {
      P.cash += amt;
      while (P.cash > CASH_CAP) { P.cash -= CASH_CAP; P.checks += 4; }
      return amt;
    }
    const got = Math.min(amt, CASH_CAP - P.cash);
    P.cash += got;
    if (got < amt) P.wasted = (P.wasted || 0) + (amt - got);
    return got;
  }
  function payCash(S, p, amt) { const P = S.players[p]; const paid = Math.min(P.cash, amt); P.cash -= paid; return paid; }

  // ---------- setup ----------
  function newGame(o = {}) {
    const seed = (o.seed ?? Math.floor(Math.random() * 2 ** 31)) >>> 0;
    const seats = o.seats || [{name: 'You', type: 'human', level: 'normal'}, {name: 'Anna', type: 'ai', level: 'normal'},
      {name: 'Madeline', type: 'ai', level: 'normal'}, {name: 'Sebastien', type: 'ai', level: 'normal'}];
    const n = seats.length;
    const S = {
      v: 1, seed, rng: seed, n, seats: seats.map((s, i) => ({color: SEAT_COLORS[i], ...s})),
      opts: {long: o.long !== false, unlimited: !!o.unlimited, fcfs: !!o.fcfs},
      players: [], rooms: Array.from({length: 8}, () => ({key: null, rs: null, guest: null})),
      entrance: [], exit: [], bistro: [], removed: [], box: [], first: 0, round: 1, empties: 0, season: 1, final: false,
      queue: [], pending: null, active: null, turnNo: 0, actRound: 0, draws: 0, log: [], last: null, over: false, lost: false, result: null, sim: false,
    };
    const deck = shuffle(S, TRAVELER_IDS.slice());
    S.removed = deck.splice(0, REMOVE[n][S.opts.long ? 'long' : 'short']);
    S.entrance = deck;
    const peas = PEASANT_IDS.slice();          // peasant1-4 and peasant5-8 are the two illustrations
    for (let p = 0; p < n; p++) {
      S.players.push({cash: START_CASH, checks: START_CHECKS, hand: [peas[p], peas[p + 4]], annexes: [{id: 'barn', under: []}], corpses: [], wasted: 0});
    }
    const spare = PEASANT_IDS.filter(id => !S.players.some(P => P.hand.includes(id)));
    if (n === 1) S.bistro.push(spare.shift(), spare.shift());
    S.box.push(...spare);
    let r = 0;
    for (let p = 0; p < n; p++) S.rooms[r++].key = p;
    for (let k = 0; k < NEUTRAL_KEYS[n]; k++) S.rooms[r++].key = 'white';
    S.first = Math.floor(rnd(S) * n);
    log(S, `${pname(S, S.first)} is the greediest and starts. Round 1.`, 'round');
    queueRound(S);
    advance(S);
    return S;
  }

  function queueRound(S) {
    S.queue.push({k: 'welcome'});
    for (let ar = 0; ar < 2; ar++) for (const p of order(S)) S.queue.push({k: 'turn', p, ar});
    S.queue.push({k: 'police'}, {k: 'leave'});
    for (const p of order(S)) S.queue.push({k: 'wages', p});
    S.queue.push({k: 'roundEnd'});
  }

  // ---------- the task queue ----------
  function advance(S) {
    let guard = 0;
    while (!S.pending && !S.over && S.queue.length) {
      if (++guard > 5000) throw new Error('advance loop');
      run(S, S.queue.shift());
    }
  }

  function draw(S) {
    const id = S.entrance.shift();
    S.draws++;
    if (!S.entrance.length) {
      S.empties++;
      if (S.empties === 1) {
        S.entrance = shuffle(S, S.exit.splice(0));
        S.season = 2;
        log(S, 'The Entrance Stack is empty: the Exit Stack is shuffled into a new one. Second season.', 'season');
        if (!S.entrance.length) { S.empties = 2; S.final = true; }
      }
      if (S.empties >= 2 && !S.final) S.final = true;
      if (S.final) log(S, 'The Entrance Stack is empty for the second time: this is the final round.', 'season');
    }
    return id;
  }

  function lodge(S, id, room) {
    const R = S.rooms[room];
    R.guest = id;
    log(S, `${T(id).name} takes room ${room + 1}.`, 'lodge', null, {room});
    if (R.rs !== null) {
      const got = gain(S, R.rs, rank(id));
      if (rank(id)) log(S, `Room service: ${pname(S, R.rs)} earns ${got}F.`, 'money', R.rs);
    }
  }

  function run(S, t) {
    switch (t.k) {
      case 'welcome': {
        const free = openRooms(S).filter(i => !S.rooms[i].guest);
        if (free.length && S.entrance.length) {
          const id = draw(S);
          S.queue.unshift({k: 'welcome'});
          if (S.opts.fcfs || free.length === 1) lodge(S, id, free[0]);
          else { S.pending = {t: 'lodge', p: S.first, card: id}; S.active = S.first; }
          return;
        }
        if (S.final && guestsInInn(S) < S.n) {
          for (const R of S.rooms) if (R.guest) { S.exit.push(R.guest); R.guest = null; }
          log(S, 'Fewer travelers than players in the inn: the last round is not played.', 'season');
          S.queue = [];
          queueFinish(S);
        }
        return;
      }
      case 'turn': {
        S.active = t.p; S.actRound = t.ar; S.turnNo++;
        S.pending = {t: 'turn', p: t.p, ar: t.ar};
        return;
      }
      case 'police': {
        const cops = S.rooms.filter(R => R.guest && isPolice(R.guest));
        if (!cops.length) return;
        log(S, `The police investigate (${cops.map(R => T(R.guest).name).join(', ')}).`, 'police');
        if (S.n === 1 && S.players[0].corpses.length) { lose(S, 'The police found an unburied corpse.'); return; }
        const tasks = order(S).filter(p => S.players[p].corpses.length).map(p => ({k: 'grave', p, why: 'police'}));
        S.queue.unshift(...tasks);
        return;
      }
      case 'grave': return gravedigger(S, t.p, t.why);
      case 'leave': {
        for (let p = 0; p < S.n; p++) {
          const occ = S.rooms.filter(R => R.key === p && R.guest).length, g = 2 * count(S.players[p], 'gardens');
          const got = gain(S, p, occ + g);
          if (occ + g) log(S, `${pname(S, p)} earns ${got}F (${occ} occupied room${occ === 1 ? '' : 's'}${g ? `, gardens +${g}` : ''}).`, 'money', p);
        }
        for (const R of S.rooms) if (R.guest) { S.exit.push(R.guest); R.guest = null; }
        log(S, 'The travelers leave the inn.', 'leave');
        return;
      }
      case 'wages': {
        const P = S.players[t.p], due = Math.max(0, P.hand.length - count(P, 'distillery'));
        if (!due) return;
        if (P.cash >= due) { P.cash -= due; log(S, `${pname(S, t.p)} pays ${due}F in wages.`, 'wages', t.p); return; }
        const paid = P.cash; P.cash = 0;
        const k = due - paid;
        log(S, `${pname(S, t.p)} can only pay ${paid}F in wages: ${k} accomplice${k === 1 ? '' : 's'} must go.`, 'wages', t.p);
        if (k >= P.hand.length) { release(S, t.p, P.hand.slice()); return; }
        S.pending = {t: 'release', p: t.p, k}; S.active = t.p;
        return;
      }
      case 'roundEnd': {
        if (S.final) { queueFinish(S); return; }
        S.first = (S.first + 1) % S.n;
        S.round++;
        log(S, `Round ${S.round}. ${pname(S, S.first)} welcomes the travelers.`, 'round');
        queueRound(S);
        return;
      }
      case 'score': return score(S);
    }
  }

  function queueFinish(S) {
    S.phase = 'final';
    if (S.n === 1 && S.players[0].corpses.length) { lose(S, 'An unburied corpse was found at the end of the game.'); return; }
    S.queue.push(...order(S).filter(p => S.players[p].corpses.length).map(p => ({k: 'grave', p, why: 'end'})), {k: 'score'});
  }

  function lose(S, why) {
    S.over = true; S.lost = true; S.pending = null; S.queue = [];
    log(S, `You lose: ${why}`, 'end');
    S.result = result(S);
  }

  // Gravedigger: 10F per unburied corpse, from a check or 10 cash each (player's choice); if both run out, all remaining cash.
  function graveRange(P) {
    const k = P.corpses.length, maxC = Math.min(P.checks, k);
    // fewest checks: as many 10F units from cash as possible; any shortfall must use checks first
    const minC = Math.min(maxC, Math.max(0, k - Math.floor(P.cash / 10)));
    return [minC, maxC];
  }
  function gravedigger(S, p, why) {
    const P = S.players[p];
    if (!P.corpses.length) return;
    const [lo, hi] = graveRange(P);
    if (lo === hi) { payGrave(S, p, lo); return; }
    S.pending = {t: 'grave', p, why, lo, hi}; S.active = p;
  }
  function payGrave(S, p, c) {
    const P = S.players[p], k = P.corpses.length;
    P.checks -= c;
    const cash = payCash(S, p, (k - c) * 10);
    log(S, `${pname(S, p)} pays the gravedigger for ${k} corpse${k === 1 ? '' : 's'}: ${[c ? `${c} check${c === 1 ? '' : 's'}` : '', cash ? `${cash}F` : ''].filter(Boolean).join(' and ') || 'nothing left to pay'}.`, 'police', p);
    S.box.push(...P.corpses.splice(0));
  }

  function release(S, p, ids) {
    const P = S.players[p];
    for (const id of ids) {
      P.hand.splice(P.hand.indexOf(id), 1);
      if (isPeasant(id)) S.bistro.push(id); else S.exit.push(id);
    }
    log(S, `${pname(S, p)} lets go of ${ids.map(id => T(id).name).join(', ')}.`, 'wages', p);
  }

  function score(S) {
    const bonus = [];
    for (let p = 0; p < S.n; p++) {
      const P = S.players[p], b = {};
      const per = (eff, col) => { const c = count(P, eff); if (c) b[eff] = gain(S, p, 4 * c * S.exit.filter(id => color(id) === col).length); };
      per('park', 'red'); per('grocery', 'blue'); per('bishopric', 'purple'); per('stables', 'green');
      const gh = count(P, 'greenhouse');
      if (gh) b.greenhouse = gain(S, p, 3 * gh * P.checks);
      bonus.push(b);
      const tot = Object.values(b).reduce((a, v) => a + v, 0);
      if (tot) log(S, `${pname(S, p)} earns ${tot}F from end-of-game annexes.`, 'money', p);
    }
    S.bonus = bonus;
    S.over = true; S.pending = null; S.phase = 'over';
    S.result = result(S);
    const w = S.result.rows.filter(r => r.rank === 1);
    log(S, S.n === 1 ? `Final booty: ${S.result.rows[0].total}F, ${S.result.rating}.`
      : `${w.map(r => r.name).join(' and ')} ${w.length > 1 ? 'share the victory' : 'wins'} with ${w[0].total}F.`, 'end');
  }

  function result(S) {
    const rows = S.players.map((P, p) => ({p, name: pname(S, p), color: S.seats[p].color, cash: P.cash, checks: P.checks, total: wealth(P),
      buried: buriedUnder(P), annexes: P.annexes.length - 1, corpses: P.corpses.length, hand: P.hand.length, bonus: (S.bonus && S.bonus[p]) || {}}));
    for (const r of rows) r.rank = 1 + rows.filter(o => o.total > r.total || (o.total === r.total && o.buried > r.buried)).length;
    const out = {rows, over: S.over, lost: S.lost, round: S.round};
    if (S.n === 1) out.rating = S.lost ? 'arrested' : SOLO_RATINGS.find(([m]) => rows[0].total >= m)[1];
    return out;
  }

  // ---------- costs and options ----------
  function cost(S, p, m) {
    const P = S.players[p];
    switch (m.t) {
      case 'bribe': return Math.max(0, m.rooms.reduce((n, i) => n + rank(S.rooms[i].guest), 0) - count(P, 'parlor'));
      case 'build': return Math.max(0, rank(m.card) - count(P, 'workshop'));
      case 'kill': return m.rooms.reduce((n, i) => n + rank(S.rooms[i].guest), 0);
      case 'bury': return Math.max(0, m.items.reduce((n, it) => n + rank(it.id), 0) - count(P, 'cellar'));
      default: return 0;
    }
  }
  const actionOf = m => ({bribe: 'bribe', peasants: 'bribe', build: 'build', kill: 'kill', killPeasant: 'kill', bury: 'bury'}[m.t]);
  // Where a paid card goes: back to hand (aptitude, or any card for Bury with a Chapel), bistro (peasants) or the Exit Stack.
  function payDest(S, p, action, id) {
    if (action === 'bury' && count(S.players[p], 'chapel')) return 'hand';
    if (APTITUDE[color(id)] === action) return 'hand';
    return isPeasant(id) ? 'bistro' : 'exit';
  }

  // Legal targets for the UI and the AI: what the actor may start this turn.
  function options(S, p) {
    const P = S.players[p], hand = P.hand.length;
    const occ = S.rooms.map((R, i) => R.guest ? i : -1).filter(i => i >= 0);
    const o = {bribe: [], kill: [], build: [], bury: [], peasants: 0, killPeasant: false,
      multiBribe: count(P, 'store') > 0, multiKill: count(P, 'butcher') > 0, multiBury: count(P, 'crypt') > 0};
    for (const i of occ) {
      if (cost(S, p, {t: 'bribe', rooms: [i]}) <= hand) o.bribe.push(i);
      if (cost(S, p, {t: 'kill', rooms: [i]}) <= hand) o.kill.push(i);
    }
    for (const id of P.hand) if (canAnnex(id) && cost(S, p, {t: 'build', card: id}) <= hand - 1) o.build.push(id);
    const slots = S.players.reduce((n, Q) => n + Q.annexes.reduce((m, a) => m + Math.max(0, annexFree(a)), 0), 0);
    if (slots) for (const id of P.corpses) if (cost(S, p, {t: 'bury', items: [{id}]}) <= hand) o.bury.push(id);
    o.peasants = Math.min(S.bistro.length, count(P, 'brewery') ? 4 : 2);
    o.killPeasant = S.bistro.length > 0;
    return o;
  }

  function annexTargets(S, extra = []) {
    // [{p, i, free}] with free slots, accounting for corpses already assigned in this action
    const out = [];
    S.players.forEach((Q, q) => Q.annexes.forEach((a, i) => {
      const used = extra.filter(e => e.owner === q && e.annex === i).length;
      if (annexFree(a) - used > 0) out.push({p: q, i, free: annexFree(a) - used});
    }));
    return out;
  }

  // ---------- validation ----------
  function check(S, m) {
    const pd = S.pending;
    if (S.over) return 'The game is over.';
    if (!pd) return 'Nothing to decide.';
    const p = pd.p, P = S.players[p];
    const uniq = a => new Set(a).size === a.length;
    switch (pd.t) {
      case 'lodge':
        if (m.t !== 'lodge') return 'Choose a room for the traveler.';
        if (!S.rooms[m.room] || S.rooms[m.room].key === null || S.rooms[m.room].guest) return 'That room is not open and free.';
        return '';
      case 'rs': {
        const R = S.rooms[m.room];
        if (m.t !== 'rs' || !R || R.key === null || R.rs !== null) return 'Choose a door with a Key and no Room Service token.';
        return '';
      }
      case 'monk':
        if (m.t !== 'monk' || !S.rooms[m.room] || S.rooms[m.room].key !== 'white') return 'Choose a room with a white Key.';
        return '';
      case 'grave':
        if (m.t !== 'grave' || !(m.checks >= pd.lo && m.checks <= pd.hi)) return `Use between ${pd.lo} and ${pd.hi} checks.`;
        return '';
      case 'release':
        if (m.t !== 'release' || m.ids.length !== pd.k || !uniq(m.ids) || !m.ids.every(id => P.hand.includes(id))) return `Choose ${pd.k} accomplice${pd.k === 1 ? '' : 's'} from your hand.`;
        return '';
      case 'turn': break;
      default: return 'Unknown decision.';
    }
    if (m.t === 'pass') {
      const k = m.launder | 0;
      if (k > 0 && P.cash < 10 * k) return 'Not enough cash for that many checks.';
      if (k < 0 && P.checks < -k) return 'Not enough checks.';
      return '';
    }
    const pay = m.pay || [];
    if (!uniq(pay) || !pay.every(id => P.hand.includes(id))) return 'Pay with distinct cards from your hand.';
    switch (m.t) {
      case 'bribe': case 'kill': {
        if (!m.rooms || !m.rooms.length || !uniq(m.rooms)) return 'Choose a traveler.';
        if (!m.rooms.every(i => S.rooms[i] && S.rooms[i].guest)) return 'That room is empty.';
        const multi = count(P, m.t === 'bribe' ? 'store' : 'butcher') > 0;
        if (m.rooms.length > 1 && !multi) return `Only one traveler per action without the ${m.t === 'bribe' ? 'Store' : 'Butcher\u2019s Shop'}.`;
        break;
      }
      case 'peasants': {
        const max = count(P, 'brewery') ? 4 : 2;
        if (!(m.n >= 1 && m.n <= Math.min(max, S.bistro.length))) return `Bribe 1 to ${Math.min(max, S.bistro.length)} peasants.`;
        break;
      }
      case 'killPeasant': if (!S.bistro.length) return 'The bistro is empty.'; break;
      case 'build':
        if (!P.hand.includes(m.card) || !canAnnex(m.card)) return 'Choose a card with an annex from your hand.';
        if (pay.includes(m.card)) return 'The annex card cannot pay for itself.';
        break;
      case 'bury': {
        if (!m.items || !m.items.length) return 'Choose a corpse.';
        if (m.items.length > 1 && !count(P, 'crypt')) return 'Only one corpse per action without the Crypt.';
        if (!uniq(m.items.map(it => it.id)) || !m.items.every(it => P.corpses.includes(it.id))) return 'Choose your own unburied corpses.';
        const used = [];
        for (const it of m.items) {
          const Q = S.players[it.owner], a = Q && Q.annexes[it.annex];
          if (!a) return 'Choose an annex.';
          if (annexFree(a) - used.filter(u => u.owner === it.owner && u.annex === it.annex).length <= 0) return 'That annex is full.';
          used.push(it);
        }
        break;
      }
      default: return 'Unknown action.';
    }
    const c = cost(S, p, m);
    if (pay.length !== c) return `This costs ${c} accomplice${c === 1 ? '' : 's'}; ${pay.length} chosen.`;
    return '';
  }

  // ---------- applying a decision ----------
  function apply(S, m) {
    const err = check(S, m);
    if (err) throw new Error(err);
    const pd = S.pending, p = pd.p, P = S.players[p];
    S.pending = null;
    S.last = {p, m: structuredClone(m), round: S.round};
    switch (pd.t) {
      case 'lodge': lodge(S, pd.card, m.room); break;
      case 'rs':
        S.rooms[m.room].rs = p;
        log(S, `${pname(S, p)} puts a Room Service token on room ${m.room + 1}.`, 'build', p, {room: m.room});
        break;
      case 'monk':
        S.rooms[m.room].key = p;
        log(S, `${pname(S, p)} claims room ${m.room + 1}.`, 'build', p, {room: m.room});
        break;
      case 'grave': payGrave(S, p, m.checks); break;
      case 'release': release(S, p, m.ids); break;
      case 'turn': action(S, p, m); break;
    }
    advance(S);
    return S;
  }

  function payWith(S, p, action, pay) {
    const P = S.players[p], back = [], gone = [];
    for (const id of pay) {
      const d = payDest(S, p, action, id);
      P.hand.splice(P.hand.indexOf(id), 1);
      if (d === 'hand') back.push(id); else { (d === 'bistro' ? S.bistro : S.exit).push(id); gone.push(id); }
    }
    P.hand.push(...back);
    return {back, gone};
  }
  const names = ids => ids.map(id => T(id).name).join(', ');
  const payText = ({back, gone}) => [gone.length ? `pays ${names(gone)}` : '', back.length ? `keeps ${names(back)}` : ''].filter(Boolean).join(', ');

  function action(S, p, m) {
    const P = S.players[p], who = pname(S, p);
    if (m.t === 'pass') {
      const k = m.launder | 0;
      if (k > 0) { P.cash -= 10 * k; P.checks += k; log(S, `${who} passes and launders ${10 * k}F into ${k} check${k === 1 ? '' : 's'}.`, 'pass', p); }
      else if (k < 0) { P.checks += k; const got = gain(S, p, -10 * k); log(S, `${who} passes and cashes ${-k} check${k === -1 ? '' : 's'} for ${got}F.`, 'pass', p); }
      else log(S, `${who} passes.`, 'pass', p);
      return;
    }
    const act = actionOf(m), paid = payWith(S, p, act, m.pay || []), pt = payText(paid);
    const suffix = pt ? ` (${pt})` : '';
    switch (m.t) {
      case 'bribe': {
        const ids = m.rooms.map(i => { const id = S.rooms[i].guest; S.rooms[i].guest = null; return id; });
        P.hand.push(...ids);
        log(S, `${who} bribes ${names(ids)}${suffix}.`, 'bribe', p, {rooms: m.rooms});
        break;
      }
      case 'peasants': {
        const ids = S.bistro.splice(0, m.n);
        P.hand.push(...ids);
        log(S, `${who} bribes ${m.n} peasant${m.n === 1 ? '' : 's'} from the bistro.`, 'bribe', p);
        break;
      }
      case 'kill': {
        const ids = m.rooms.map(i => { const id = S.rooms[i].guest; S.rooms[i].guest = null; return id; });
        P.corpses.push(...ids);
        log(S, `${who} kills ${names(ids)}${suffix}.`, 'kill', p, {rooms: m.rooms});
        break;
      }
      case 'killPeasant': {
        const id = S.bistro.shift();
        P.corpses.push(id);
        log(S, `${who} kills a peasant in the bistro.`, 'kill', p);
        break;
      }
      case 'bury': {
        for (const it of m.items) {
          P.corpses.splice(P.corpses.indexOf(it.id), 1);
          const a = S.players[it.owner].annexes[it.annex];
          a.under.push(it.id);
          const money = T(it.id).money, where = a.id === 'barn' ? 'barn' : T(a.id).annex;
          if (it.owner === p) {
            const got = gain(S, p, money);
            log(S, `${who} buries ${T(it.id).name} under ${it.owner === p ? 'their' : ''} ${where} and takes ${got}F${suffix}.`, 'bury', p);
          } else {
            const g1 = gain(S, p, money / 2), g2 = gain(S, it.owner, money / 2);
            log(S, `${who} buries ${T(it.id).name} under ${pname(S, it.owner)}\u2019s ${where}: ${g1}F each way (${g2}F to ${pname(S, it.owner)})${suffix}.`, 'bury', p);
          }
        }
        break;
      }
      case 'build': {
        P.hand.splice(P.hand.indexOf(m.card), 1);
        P.annexes.push({id: m.card, under: []});
        log(S, `${who} builds the ${T(m.card).annex}${suffix}.`, 'build', p, {card: m.card});
        built(S, p, m.card);
        break;
      }
    }
  }

  function built(S, p, id) {
    const P = S.players[p], eff = T(id).effect, earn = (amt, why) => { const got = gain(S, p, amt); if (amt) log(S, `${pname(S, p)} earns ${got}F${why ? ` (${why})` : ''}.`, 'money', p); };
    switch (eff) {
      case 'kiosk': earn(colorAnnexes(P, 'blue'), 'blue annexes'); break;
      case 'vegetable': earn(colorAnnexes(P, 'red'), 'red annexes'); break;
      case 'altar': earn(colorAnnexes(P, 'purple'), 'purple annexes'); break;
      case 'chandelier': earn(4); break;
      case 'bed': earn(6); break;
      case 'dining': earn(9); break;
      case 'detached': earn(18); break;
      case 'park': case 'grocery': case 'bishopric': case 'stables': earn(4); break;
      case 'roomservice': {

        if (doors.length === 1) { S.rooms[doors[0]].rs = p; log(S, `${pname(S, p)} puts a Room Service token on room ${doors[0] + 1}.`, 'build', p); }
        else if (doors.length) { S.pending = {t: 'rs', p}; S.active = p; }
        break;
      }
      case 'room': {

  // Cheapest payment: cards that come back first, then peasants (back to the bistro), then the least useful.
  function keepValue(S, p, id) {

})();

// ===== AI innkeepers: same engine, heuristic evaluation. Normal is deterministic for a given state. =====
const AI = (() => {
  const E = Engine;
  const clone = S => { const X = structuredClone(S); X.sim = true; return X; };

  function roundsLeft(S) {
    const open = Math.max(1, E.openRooms(S).length);
    const later = S.season === 1 ? S.exit.length + E.guestsInInn(S) : 0;
    return Math.max(0, (S.entrance.length + later) / open);
  }

  const PERSIST = {workshop: 1.6, parlor: 1.6, cellar: 1.6, store: 1.1, butcher: 1.1, crypt: 1, chapel: 1, brewery: .5, distillery: 1, gardens: 2};
  function annexWorth(S, p, id, R) {
    const t = T(id), P = S.players[p], w = Math.min(R, 4);
    let v = t.rank * 4.5 * Math.min(1, R / 2);                        // burial slots
    switch (t.effect) {
      case 'chandelier': v += 4; break;
      case 'bed': v += 6; break;
      case 'dining': v += 9; break;
      case 'detached': v += 18; break;
      case 'kiosk': v += E.colorAnnexes(P, 'blue') + 1; break;
      case 'vegetable': v += E.colorAnnexes(P, 'red') + 1; break;
      case 'altar': v += E.colorAnnexes(P, 'purple') + 1; break;
      case 'park': case 'grocery': case 'bishopric': case 'stables': v += 4 + endBonus(S, t.effect, R); break;
      case 'greenhouse': v += 3 * (P.checks + R * .6); break;
      case 'roomservice': v += 1.4 * w; break;
      case 'room': v += S.rooms.some(r => r.key === 'white') ? .9 * w : 0; break;
      default: v += (PERSIST[t.effect] || 0) * w;
    }
    return v;
  }
  const END_COL = {park: 'red', grocery: 'blue', bishopric: 'purple', stables: 'green'};
  function endBonus(S, eff, R) {
    const col = END_COL[eff], now = S.exit.filter(id => E.color(id) === col).length;
    return 4 * (now + R * E.openRooms(S).length * .12);
  }

  // Estimated final money of seat p.
  function estimate(S, p, R) {
    const P = S.players[p];
    if (S.over) return E.wealth(P);
    let v = P.cash + 10 * P.checks - (S.opts.unlimited ? 0 : .5 * Math.max(0, P.cash - 28));
    const cops = S.rooms.some(r => r.guest && E.isPolice(r.guest)) && S.queue.some(t => t.k === 'police');
    const myTurns = S.queue.filter(t => t.k === 'turn' && t.p === p).length + (S.pending && S.pending.t === 'turn' && S.pending.p === p ? 1 : 0);
    const free = P.annexes.reduce((n, a) => n + Math.max(0, E.annexFree(a)), 0);
    const anyFree = S.players.some(Q => Q.annexes.some(a => E.annexFree(a) > 0));
    let used = 0, turnsLeft = myTurns * (E.count(P, 'crypt') ? 3 : 1), handLeft = P.hand.length;
    const lastChance = !myTurns && (S.phase === 'final' || (S.final && !S.queue.some(t => t.k === 'turn')));
    for (const id of P.corpses.slice().sort((a, b) => T(b).money - T(a).money)) {
      const t = T(id), c = Math.max(0, t.rank - E.count(P, 'cellar')), own = used < free, slot = own || anyFree;
      const money = t.money * (own ? 1 : .5);
      let cv;
      if (cops || lastChance) {
        // the investigation (or the end) comes before the next round: bury now or pay 10F
        if (slot && turnsLeft > 0 && handLeft >= c) { cv = money - c * 1.2 - 1; turnsLeft--; handLeft -= c; if (own) used++; }
        else cv = -10;
      } else {
        cv = (slot ? money * .8 : money * .2) - c * 1.2 - 3;
        if (own) used++;
      }
      v += cv;
    }
    v += Math.max(0, free - used) * 4.5 * Math.min(1, R / 2);
    for (const a of P.annexes) {
      if (a.id === 'barn') continue;
      const t = T(a.id);
      if (END_COL[t.effect]) v += endBonus(S, t.effect, R);
      else if (t.effect === 'greenhouse') v += 3 * (P.checks + R * .6);
      else if (t.effect === 'roomservice') v += 1.4 * Math.min(R, 4);
      else v += (PERSIST[t.effect] || 0) * Math.min(R, 4);
    }
    v += S.rooms.filter(r => r.key === p).length * Math.min(R, 6) * .9;
    const wages = Math.min(R, 2.5);
    for (const id of P.hand) {
      const t = T(id);
      let h = 1.2 + (APTITUDE[t.color] ? 1.8 : 0);
      if (t.annex) h += annexWorth(S, p, id, R) * .45;
      v += h - wages;

    return v;
  }

  function value(S, p) {
    const R = roundsLeft(S), mine = estimate(S, p, R);

    let best = -1e9;
    for (let q = 0; q < S.n; q++) if (q !== p) best = Math.max(best, estimate(S, q, R));
    return mine - .4 * best;
  }

  // ---------- candidate moves for the turn decision ----------
  function withPay(S, p, m) { const pay = E.suggestPay(S, p, m); return pay ? {...m, pay} : null; }
  function candidates(S, p) {
    const P = S.players[p], o = E.options(S, p), out = [{t: 'pass', launder: 0}];
    const reserve = P.hand.length + 3, k = Math.floor((P.cash - reserve) / 10);
    if (k > 0) out.push({t: 'pass', launder: k});
    if (P.checks && P.cash < P.hand.length) out.push({t: 'pass', launder: -1});
    for (const i of o.bribe) out.push(withPay(S, p, {t: 'bribe', rooms: [i]}));
    for (const i of o.kill) out.push(withPay(S, p, {t: 'kill', rooms: [i]}));
    if (o.multiBribe && o.bribe.length > 1) out.push(withPay(S, p, {t: 'bribe', rooms: o.bribe.slice().sort((a, b) => E.rank(S.rooms[b].guest) - E.rank(S.rooms[a].guest)).slice(0, 2)}));
    if (o.multiKill && o.kill.length > 1) {
      const cheap = o.kill.slice().sort((a, b) => E.rank(S.rooms[a].guest) - E.rank(S.rooms[b].guest));
      out.push(withPay(S, p, {t: 'kill', rooms: cheap.slice(0, 2)}), withPay(S, p, {t: 'kill', rooms: cheap.slice(0, 3)}));
    }
    for (let n = 1; n <= o.peasants; n++) out.push({t: 'peasants', n, pay: []});
    if (o.killPeasant) out.push({t: 'killPeasant', pay: []});
    for (const id of o.build) out.push(withPay(S, p, {t: 'build', card: id}));
    for (const id of o.bury) {
      const targets = E.annexTargets(S);
      const own = targets.filter(a => a.p === p), other = targets.filter(a => a.p !== p).slice(0, 3);
      for (const a of [...own, ...other]) out.push(withPay(S, p, {t: 'bury', items: [{id, owner: a.p, annex: a.i}]}));
    }
    if (o.multiBury && P.corpses.length > 1) {
      const items = [], used = [];
      for (const id of P.corpses) {
        const a = E.annexTargets(S, used).find(x => x.p === p) || E.annexTargets(S, used)[0];
        if (!a) break;
        const it = {id, owner: a.p, annex: a.i}; items.push(it); used.push(it);
      }
      if (items.length > 1) out.push(withPay(S, p, {t: 'bury', items}));
    }
    return out.filter(m => m && !E.check(S, m));
  }

  // ---------- small decisions ----------
  function minor(S) {
    const pd = S.pending, p = pd.p, P = S.players[p];
    switch (pd.t) {
      case 'lodge': {
        const id = pd.card, r = E.rank(id);
        let best = -1, bs = -1e9;
        S.rooms.forEach((R, i) => {
          if (R.key === null || R.guest) return;
          let s = 0;
          if (R.rs === p) s += r * 2; else if (R.rs !== null) s -= r;
          if (R.key === p) s += .5;
          if (s > bs) { bs = s; best = i; }
        });
        return {t: 'lodge', room: best};
      }
      case 'rs': {
        const doors = S.rooms.map((R, i) => R.key !== null && R.rs === null ? i : -1).filter(i => i >= 0);
        return {t: 'rs', room: doors.find(i => S.rooms[i].key === p) ?? doors[0]};
      }
      case 'monk': {
        const w = S.rooms.map((R, i) => R.key === 'white' ? i : -1).filter(i => i >= 0);
        return {t: 'monk', room: w.find(i => S.rooms[i].guest) ?? w[0]};
      }
      case 'grave': return {t: 'grave', checks: pd.lo};
      case 'release': {
        const h = P.hand.slice().sort((a, b) => (E.isPeasant(a) ? -1 : E.keepValue(S, p, a)) - (E.isPeasant(b) ? -1 : E.keepValue(S, p, b)) || (a < b ? -1 : 1));
        return {t: 'release', ids: h.slice(0, pd.k)};
      }
    }
    return null;
  }

  function settle(X, p) {
    // resolve p's own follow-up decisions (Room Service, Monk) so the evaluation sees the result
    let g = 0;
    while (X.pending && X.pending.p === p && X.pending.t !== 'turn' && X.pending.t !== 'lodge' && g++ < 5) E.apply(X, minor(X));

  function scoreMove(S, p, m) {
    const X = clone(S);
    E.apply(X, m);
    settle(X, p);
    return value(X, p);
  }

  function normal(S) {
    const p = S.pending.p, cs = candidates(S, p);
    let best = cs[0], bs = -1e9;
    for (const m of cs) { const s = scoreMove(S, p, m); if (s > bs + 1e-9) { bs = s; best = m; } }
    return best;
  }

  function determinize(S, seed) {
    // hide what the AI cannot know: the entrance below its face-up top card, mixed with the cards removed at setup
    const X = clone(S);
    X.rng = seed >>> 0;
    if (X.entrance.length > 1) {
      const pool = E.shuffle(X, X.entrance.slice(1).concat(X.removed));
      X.entrance = [X.entrance[0], ...pool.slice(0, X.entrance.length - 1)];
      X.removed = pool.slice(X.entrance.length - 1);
    }
    return X;
  }
  function playout(X, p, start) {
    let g = 0;
    while (!X.over && X.pending && X.round === start && g++ < 80) {
      const m = X.pending.t === 'turn' ? normal(X) : minor(X);
      E.apply(X, m);
    }
    return value(X, p);
  }
  function hard(S) {
    const p = S.pending.p, cs = candidates(S, p);
    const ranked = cs.map(m => [m, scoreMove(S, p, m)]).sort((a, b) => b[1] - a[1]).slice(0, 8);
    let best = ranked[0][0], bs = -1e9;
    for (const [m, s0] of ranked) {
      let tot = 0;
      for (let k = 0; k < 2; k++) {

        E.apply(X, m); settle(X, p);

    const ends = P.annexes.filter(a => a.id !== 'barn' && END_COL[T(a.id).effect]).map(a => T(a.id).annex);

    return notes;
  }

  return {decide, normal, hard, easy, minor, candidates, value, estimate, intel, roundsLeft};
})();

// ===== Rule tests (?test). Every rules clarification from the owner is a test here. =====
const Tests = (() => {

  const turn = (S, p = 0) => { S.pending = {t: 'turn', p, ar: 0}; };

      if (!(a[0] > b[0] || (a[0] === b[0] && (a[1] || 0) > (b[1] || 0)) || (a[0] === b[0] && a[1] === b[1] && (a[2] || 0) > (b[2] || 0)))) return 'out of order at ' + CHANGELOG[i].v;

// ---------- art: photos keyed by card type (front) and <type>~b (dead side), barn, B:board.
// The local build embeds them (publish.py); the web build fetches art.bin, AES-GCM encrypted, and unlocks it only with the key from a private #art= link.
const ART = {};
(src => {
  for (const [id, uri] of Object.entries(src || {})) {
    try {
      const bin = atob(uri.slice(uri.indexOf(',') + 1)), a = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
      ART[id] = URL.createObjectURL(new Blob([a], {type: uri.slice(5, uri.indexOf(';'))}));
    } catch { ART[id] = uri; }
  }
})(/*CARDART*/null/*/CARDART*/);
const hasArt = () => Object.keys(ART).length > 0;
const art = id => UI.art && ART[id];
async function artUnlock() {
  if (hasArt() || !/^https?:$/.test(location.protocol) || !(window.crypto && crypto.subtle)) return;
  const m = location.hash.match(/(?:^#|&)art=([A-Za-z0-9_-]{43})/);
  if (m) { store.set('artkey', m[1]); history.replaceState(null, '', location.pathname + location.search); }
  const k = store.get('artkey', null);
  if (!k) return;
  try {
    const raw = Uint8Array.from(atob(k.replace(/-/g, '+').replace(/_/g, '/') + '='), c => c.charCodeAt(0));
    const res = await fetch('art.bin');
    if (!res.ok) return;
    const buf = new Uint8Array(await res.arrayBuffer()), magic = buf.subarray(0, 4);
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: buf.subarray(4, 16), additionalData: magic}, key, buf.subarray(16)));
    const hl = new DataView(pt.buffer).getUint32(0);
    let off = 4 + hl;
    for (const [id, type, len] of JSON.parse(new TextDecoder().decode(pt.subarray(4, off)))) {
      ART[id] = URL.createObjectURL(new Blob([pt.subarray(off, off + len)], {type})); off += len;
    }
    if (UI.S && $('#game')) renderGame(); else if ($('.landing')) landing();
  } catch (e) {
    if (e && e.name === 'OperationError') { store.del('artkey'); toast('This art link is not valid for this version.'); }
  }
}
addEventListener('hashchange', artUnlock);

function wrap(text, n) {
  const out = []; let line = '';
  for (const w of text.split(' ')) { if ((line + ' ' + w).trim().length > n && line) { out.push(line); line = w; } else line = (line + ' ' + w).trim(); }
  if (line) out.push(line);

function outcomeText(S, m, p) {
  const pv = Engine.preview(S, m); if (!pv) return '';
  const out = [];
  for (const d of pv) {
    const parts = [];
    if (d.cash) parts.push(`${d.cash > 0 ? '+' : '\u2212'}${Math.abs(d.cash)}F`);
    if (d.checks) parts.push(`${d.checks > 0 ? '+' : '\u2212'}${plural(Math.abs(d.checks), 'check')}`);
    if (d.p === p && d.hand) parts.push(`${d.hand > 0 ? '+' : '\u2212'}${plural(Math.abs(d.hand), 'card')} in hand`);
    if (parts.length) out.push(`${d.p === p ? (you(p) ? 'You' : esc(pname(p))) : esc(pname(d.p))}: ${parts.join(', ')}`);
  }
  const P = S.players[p];
  if (m.t === 'bribe') out.push(`${m.rooms.map(i => T(S.rooms[i].guest).name).join(' and ')} ${m.rooms.length > 1 ? 'join' : 'joins'} your hand (+1F wages each)`);
  if (m.t === 'build') out.push(`new ${T(m.card).annex}, room for ${plural(T(m.card).rank, 'corpse')}`);
  if (m.t === 'kill' || m.t === 'killPeasant') out.push('a corpse to bury before the police come');
  if (P.cash + (pv[p].cash || 0) >= 40 && !S.opts.unlimited && (pv[p].cash || 0) > 0) out.push('cash capped at 40F');
  return out.join(' \u00B7 ') || 'no money changes hands';
}

function modal({title, body, x = true, dock = true, buttons = [], cls = ''}) {
  closeModal();

  b.innerHTML = `<div class="modal ${cls}" role="dialog" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2>${dock ? `<button class="ghost" data-m="dock" title="Dock to side">\u21E5</button>` : ''}${x ? `<button class="ghost" data-m="x" aria-label="Close">\u2715</button>` : ''}</div>
    <div class="mb">${body}</div><div class="mf">${buttons.map((bt, i) => `<button class="${bt.cls || ''}" data-m="b${i}" ${bt.disabled ? 'disabled' : ''}>${bt.label}</button>`).join('')}${x ? `<button data-m="x">Close</button>` : ''}</div></div>`;
  b.addEventListener('click', e => {
    const m = e.target.closest('[data-m]');
    if (e.target === b && x) return closeModal();
    if (!m) return;
    const k = m.dataset.m;
    if (k === 'x') return closeModal();
    if (k === 'dock') { UI.docked = !UI.docked; b.classList.toggle('docked', UI.docked); return; }
    const bt = buttons[+k.slice(1)]; if (bt && bt.fn) { if (!bt.keep) closeModal(); bt.fn(); }
  });
  document.body.appendChild(b);
  UI.modal = {el: b, x};
}

// ---------- committing decisions ----------
function commit(m, human) {
  const prev = UI.S, N = structuredClone(prev);
  Engine.apply(N, m);
  if (human) UI.undo.push(prev);
  if (N.draws !== prev.draws) UI.undo = [];
  N.players.forEach((P, p) => {
    const d = Engine.wealth(P) - Engine.wealth(prev.players[p]), c = P.cash - prev.players[p].cash;
    if (d || c) UI.flash.add('p' + p);
    if (d && !UI.auto && !UI.freeze) { const t = Date.now(); UI.deltas.push({p, v: d, t}); setTimeout(() => { UI.deltas = UI.deltas.filter(x => x.t !== t); }, 1800); }
  });
  N.rooms.forEach((R, i) => { const O = prev.rooms[i]; if (R.guest !== O.guest || R.key !== O.key || R.rs !== O.rs) UI.flash.add('r' + i); });
  const fresh = N.log.slice(prev.log.length), kinds = new Set(fresh.map(l => l.kind));
  Sound(kinds.has('end') ? (N.lost ? 'lose' : 'win') : kinds.has('season') ? 'season' : kinds.has('police') ? 'police' : kinds.has('kill') ? 'kill' : kinds.has('bury') ? 'bury' : kinds.has('round') ? 'round' : kinds.has('money') ? 'coin' : 'card');
  if (!human && !UI.auto && m.t !== 'lodge' && prev.pending && prev.pending.t !== 'lodge') aiAnnounce(prev.pending.p, fresh.filter(l => l.p === prev.pending.p));
  UI.S = N; UI.sel = null; UI.kcur = null;
  if (!UI.auto) {
    if (N.season !== prev.season && humans().length && !UI.freeze) { UI.hold = true; setTimeout(() => showSeason(N), 400); }
    else if (N.final && !prev.final && !UI.freeze) toast('Final round: the Entrance Stack is empty for the second time.', 3000);
    else if (N.round !== prev.round && !UI.freeze && humans().length) toast(`Round ${N.round}`, 1200);
    if (kinds.has('police') && fresh.some(l => l.text.includes('investigate')) && !UI.freeze) toast(`${ICON.police} ${fresh.filter(l => l.kind === 'police').map(l => l.text).join('\n')}`, 3200);
  }
  save();
  if (!UI.auto) { renderGame(); next(); }
}
function undo() {
  if (!UI.undo.length) return;
  clearTimeout(UI.timer); UI.gen++;
  UI.S = UI.undo.pop(); UI.sel = null; UI.kcur = null; UI.hold = false;
  if (pnp()) UI.viewer = actor(UI.S);
  save(); renderGame(); next();
}
// [pause before an AI action, pause before an AI lodging] in ms
const AI_SPEED = {slow: [1800, 450], normal: [1000, 260], fast: [420, 90]};
function next() {
  clearTimeout(UI.timer);
  const S = UI.S, gen = UI.gen;
  if (!S) return;
  if (S.over) { finishGame(); return; }
  if (UI.hold) return;
  const p = actor(S);
  if (p === null) return;
  if (!isHuman(p)) {
    const D = UI.freeze ? [0, 0] : !UI.anim ? [380, 100] : AI_SPEED[UI.aiSpeed] || AI_SPEED.normal;
    UI.timer = setTimeout(() => {
      if (gen !== UI.gen || UI.S !== S) return;
      commit(AI.decide(UI.S, seat(p).level), false);
    }, S.pending.t === 'lodge' ? D[1] : D[0]);
  } else if (pnp() && UI.viewer !== p) showPass(p);
  else if (S.pending.t === 'release' && !UI.sel) { UI.sel = {mode: 'release', ids: AI.minor(S).ids}; renderGame(); }
}
function aiAnnounce(p, lines) {

  d.innerHTML = `<i></i><div>${lines.slice(0, 3).map(l => esc(l.text)).join('<br>')}</div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), (AI_SPEED[UI.aiSpeed] || AI_SPEED.normal)[0] * 1.6 + 600);
}

  const d = document.createElement('div'); d.className = 'pass';

  document.body.appendChild(d);
  $('#passok').onclick = () => { d.remove(); UI.viewer = p; renderGame(); next(); };
}

// ---------- season transition ----------
const snap = S => S.players.map(P => ({total: Engine.wealth(P), annexes: P.annexes.length - 1, buried: Engine.buriedUnder(P), hand: P.hand.length}));
function showSeason(N) {
  if (N !== UI.S) { UI.hold = false; return next(); }
  const was = UI.seasonSnap, now = snap(N);
  const rows = [['Wealth', 'total', 'F'], ['Annexes', 'annexes', ''], ['Buried', 'buried', ''], ['Accomplices', 'hand', '']];
  const cell = (p, k, suf) => `<td><b>${now[p][k]}</b><small>${suf}</small>${was ? (d => d ? ` <span class="${d > 0 ? 'up' : 'dn'}">${d > 0 ? '+' : '\u2212'}${Math.abs(d)}</span>` : '')(now[p][k] - was[p][k]) : ''}</td>`;
  const d = document.createElement('div');
  d.className = 'chcard' + (UI.anim ? '' : ' still');
  d.innerHTML = `<div class="chin"><div class="chk">The first season is over</div><h2>Second season</h2>
    <div class="chsub">The travelers who left alive come back: the Exit Stack is the new Entrance Stack. When it runs out, the game ends after that round.</div>
    <table class="res chrecap"><tr><th></th>${N.players.map((_, p) => `<th style="color:${pcol(p)}">${esc(who(p))}</th>`).join('')}</tr>${rows.map(([lab, k, suf]) => `<tr><td>${lab}</td>${N.players.map((_, p) => cell(p, k, suf)).join('')}</tr>`).join('')}</table>
    <div class="muted">Tap or press Enter to continue.</div></div>`;
  document.body.appendChild(d);
  let done = false;
  const go = () => { if (done) return; done = true; d.classList.add('out'); setTimeout(() => d.remove(), 300); UI.seasonSnap = now; save(); UI.hold = false; renderGame(); next(); };
  d.onclick = go;
  if (!UI.freeze) setTimeout(go, 9000);
}

// ---------- end of game ----------
function finishGame() {
  if (UI.S.done) return;
  UI.S.done = true; save();
  recordStats(UI.S);
  if (!UI.auto) setTimeout(showResult, UI.freeze ? 0 : 900);
}
const BONUS_NAMES = {park: 'Park', grocery: 'Grocery', bishopric: 'Bishopric', stables: 'Stables', greenhouse: 'Greenhouse'};
function showResult() {
  const S = UI.S, R = S.result, rows = R.rows.slice().sort((a, b) => a.rank - b.rank || b.total - a.total), top = rows[0];
  const h = humans(), me = h.length === 1 ? h[0] : -1, mine = R.rows[me];
  const head = S.lost ? 'Arrested!' : S.n === 1 ? `${R.rows[0].total}F: ${R.rating}` : me >= 0 ? (mine.rank === 1 ? (rows.filter(r => r.rank === 1).length > 1 ? 'A shared victory' : 'Victory!') : `${ordinal(mine.rank)} place`) : `${esc(rows.filter(r => r.rank === 1).map(r => r.name).join(' & '))} ${rows.filter(r => r.rank === 1).length > 1 ? 'share the win' : 'wins'}`;
  const max = Math.max(1, ...rows.map(r => r.total));
  const table = rows.map((r, k) => `<div class="rrow ${r.rank === 1 ? 'win' : ''}" style="--pc:${SEAT_HEX[r.color]};--w:${r.total / max * 100}%;--d:${k * 180}ms">
    <span class="rk">${r.rank}</span><b>${esc(you(r.p) ? 'You' : r.name)}</b><span class="rbar"><i></i></span><span class="rt">${r.total}F</span>
    <small>${r.cash}F cash + ${plural(r.checks, 'check')}${Object.entries(r.bonus).filter(([, v]) => v).map(([k, v]) => ` \u00B7 ${BONUS_NAMES[k]} +${v}`).join('')} \u00B7 ${r.buried} buried</small></div>`).join('');
  modal({title: S.n === 1 ? 'Final booty' : 'Final tally', dock: false, cls: 'result', body: `<div class="banner ${S.lost ? 'lost' : ''}">${head}</div>${table}
    ${S.n > 1 && rows.filter(r => r.rank === top.rank && r.total === top.total).length > 1 ? '<p class="muted">Tied on money: the most corpses under their own annexes breaks the tie.</p>' : ''}
    ${S.n === 1 && !S.lost ? `<p class="muted">Long game ratings: 110F worrying \u00B7 130F hazardous \u00B7 150F evil \u00B7 170F+ demonic innkeeper.</p>` : ''}`,
  buttons: [{label: '\u{1F4CA} Statistics', cls: 'primary', fn: showStats}, {label: '\u{1F4E4} Share result', fn: showShare}, {label: 'New game', fn: landing}]});
}
const ordinal = n => n + (['th', 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || 'th');

// ---------- interaction ----------
function startSel(sel) { UI.sel = sel; if (sel.pay === undefined && ['bribe', 'kill', 'build', 'bury'].includes(sel.mode)) sel.pay = Engine.suggestPay(UI.S, actor(UI.S), selMove()) || []; renderGame(); }
function repay() { const sel = UI.sel; sel.pay = Engine.suggestPay(UI.S, actor(UI.S), selMove()) || sel.pay.slice(0, selCost()); }
function defaultDest(used) {
  const S = UI.S, p = actor(S), t = Engine.annexTargets(S, used);
  return t.filter(a => a.p === p && a.i > 0).sort((a, b) => b.free - a.free)[0] || t.find(a => a.p === p) || t[0] || null;
}
function onRoom(i) {
  const S = UI.S, R = S.rooms[i];
  if (!myTurn()) return R.guest ? showCard(R.guest) : null;
  const pd = S.pending, sel = UI.sel;
  if (pd.t === 'lodge') { if (tgtRoom(i)) commit({t: 'lodge', room: i}, true); return; }
  if (pd.t === 'rs') { if (tgtRoom(i)) commit({t: 'rs', room: i}, true); return; }
  if (pd.t === 'monk') { if (tgtRoom(i)) commit({t: 'monk', room: i}, true); return; }
  if (pd.t !== 'turn') return R.guest ? showCard(R.guest) : null;
  if (!R.guest) return;
  if (sel && (sel.mode === 'bribe' || sel.mode === 'kill') && sel.multi) {
    sel.rooms = sel.rooms.includes(i) ? sel.rooms.filter(x => x !== i) : [...sel.rooms, i];
    if (!sel.rooms.length) { UI.sel = null; return renderGame(); }
    repay(); return renderGame();
  }
  if (sel && sel.room === i && sel.mode === 'choose') { UI.sel = null; return renderGame(); }
  if (!tgtRoom(i)) return showCard(R.guest);
  startSel({mode: 'choose', room: i});
}
function onHand(id) {
  const S = UI.S, sel = UI.sel;
  if (!myTurn()) return showCard(id);
  const pd = S.pending;
  if (pd.t === 'release') {
    sel.ids = sel.ids.includes(id) ? sel.ids.filter(x => x !== id) : [...sel.ids, id].slice(-pd.k);
    return renderGame();
  }
  if (pd.t !== 'turn') return showCard(id);
  if (sel && ['bribe', 'kill', 'build', 'bury'].includes(sel.mode)) {
    if (id === sel.card) return;
    const need = selCost();
    if (sel.pay.includes(id)) sel.pay = sel.pay.filter(x => x !== id);
    else { sel.pay.push(id); if (sel.pay.length > need) sel.pay.shift(); }
    return renderGame();
  }
  if (Engine.options(S, pd.p).build.includes(id)) return startSel({mode: 'build', card: id});
  showCard(id);
}
function onCorpse(id) {
  const S = UI.S, sel = UI.sel;
  if (!myTurn() || S.pending.t !== 'turn') return showCard(id, true);
  if (sel && sel.mode === 'bury') {
    if (!Engine.count(S.players[S.pending.p], 'crypt')) return;
    if (sel.items.some(it => it.id === id)) { sel.items = sel.items.filter(it => it.id !== id); if (!sel.items.length) UI.sel = null; else repay(); return renderGame(); }
    const d = defaultDest(sel.items);
    if (!d) return toast('No free annex left');
    sel.items.push({id, owner: d.p, annex: d.i}); repay(); return renderGame();
  }
  if (!tgtCorpse(id)) return showCard(id, true);
  const d = defaultDest([]);
  startSel({mode: 'bury', items: [{id, owner: d ? d.p : undefined, annex: d ? d.i : undefined}]});
}
function onAnnex(q, i) {
  const S = UI.S, sel = UI.sel;
  if (sel && sel.mode === 'bury' && myTurn()) {
    if (!tgtAnnex(q, i)) return toast('That annex is full');
    const it = sel.items[sel.items.length - 1]; it.owner = q; it.annex = i; return renderGame();
  }
  const a = S.players[q].annexes[i];
  modal({title: a.id === 'barn' ? `${pname(q)}\u2019s barn` : `${pname(q)}\u2019s ${T(a.id).annex}`, body: `<div class="cardpop">${a.id === 'barn' ? barnSVG() : cardSVG(a.id)}<div>
    <p>${a.id === 'barn' ? 'The player aid is a rank-1 annex: one corpse can be buried under it.' : esc(T(a.id).text)}</p><p>Capacity ${Engine.annexRank(a)}: ${a.under.length ? a.under.map(id => `${esc(T(id).name)} (${T(id).money}F)`).join(', ') : 'nothing buried yet'}.</p>
    <p class="muted">Anyone may bury under any annex. Burying under another player\u2019s annex splits the money in half.</p></div></div>`});
}
function onBistro() {
  if (!myTurn() || UI.S.pending.t !== 'turn') return modal({title: 'The bistro', body: `<p>${plural(UI.S.bistro.length, 'peasant')} drinking at the bistro. Peasants are rank 0 and carry 4F. Bribe 1 or 2 at once for free (up to 4 with the Brewery), or kill one for free.</p><p class="muted">Peasants used to pay for an action always come back here.</p>`});
  if (!UI.S.bistro.length) return toast('The bistro is empty');
  startSel({mode: 'bistro'});
}
function onOpt(o) {
  const S = UI.S, sel = UI.sel, pd = S.pending, p = pd && pd.p;
  if (o === 'cancel') { UI.sel = null; return renderGame(); }
  if (o === 'autolodge') { let g = 0; let X = UI.S; const prev = X; X = structuredClone(X); while (X.pending && X.pending.t === 'lodge' && X.pending.p === p && g++ < 12) Engine.apply(X, AI.minor(X)); UI.S = prev; return commitState(X); }
  if (o === 'pass') return startSel({mode: 'pass', k: 0});
  if (o === 'k+') { sel.k = (sel.k || 0) + 1; return renderGame(); }
  if (o === 'k-') { sel.k = (sel.k || 0) - 1; return renderGame(); }
  if (o === 'bribe' || o === 'kill') {
    const multi = Engine.count(S.players[p], o === 'bribe' ? 'store' : 'butcher') > 0;
    UI.sel = {mode: o, rooms: [sel.room], multi}; repay(); return renderGame();
  }
  if (o.startsWith('peas:')) return commit({t: 'peasants', n: +o.slice(5), pay: []}, true);
  if (o === 'killpeas') return commit({t: 'killPeasant', pay: []}, true);
  if (o.startsWith('grave:')) return commit({t: 'grave', checks: +o.slice(6)}, true);
  if (o === 'release') return commit({t: 'release', ids: sel.ids}, true);
  if (o === 'confirm') { const m = selMove(); if (m && !Engine.check(S, m)) commit(m, true); return; }
}
function commitState(X) {
  // several engine steps at once (auto-lodging): treat as one undoable human move
  const prev = UI.S;
  UI.undo = [];
  UI.S = X; UI.sel = null;
  X.rooms.forEach((R, i) => { if (R.guest !== prev.rooms[i].guest) UI.flash.add('r' + i); });
  Sound('card'); save(); renderGame(); next();
}
function showCard(id, dead) {
  const t = T(id), apt = APTITUDE[t.color];
  modal({title: t.name, body: `<div class="cardpop"><div class="flip">${cardSVG(id, {dead: !!dead})}${cardSVG(id, {dead: !dead})}</div><div>
    <p><b>${COLOR_NAMES[t.color][0].toUpperCase() + COLOR_NAMES[t.color].slice(1)}</b>, rank ${t.rank}, ${t.money}F in his pockets.</p>
    <p>${apt ? `Aptitude: <b>${ICON[apt]} ${ACTION_NAMES[apt]}</b> (returns to hand when used to pay for it).` : 'No aptitude: always leaves when used to pay.'}</p>
    ${t.annex ? `<p>Annex: <b>${esc(t.annex)}</b> (rank ${t.rank}): ${esc(t.text)}</p>` : `<p>${t.color === 'grey' ? 'Police cannot become annexes. A policeman in a room at the end of the round starts an investigation.' : 'Peasants cannot become annexes and always return to the bistro.'}</p>`}
    <p class="muted">Bribe or kill: ${plural(t.rank, 'accomplice')}. Bury: ${plural(t.rank, 'accomplice')}, holding ${t.money}F.</p></div></div>`});
}
function showPlayer(p) {
  const S = UI.S, P = S.players[p];
  modal({title: `${who(p)} (${Engine.wealth(P)}F)`, cls: 'wide', body: `<p>${P.cash}F cash \u00B7 ${plural(P.checks, 'check')} \u00B7 ${plural(Engine.keysOf(S, p), 'room')} \u00B7 ${Engine.buriedUnder(P)} buried under their annexes</p>
    <h3 class="sh">Hand</h3><div class="cards popcards">${P.hand.map(id => cardSVG(id)).join('') || '<span class="muted">empty</span>'}</div>
    <h3 class="sh">Annexes</h3><div class="cards popcards">${P.annexes.map((a, i) => annexHTML(p, i, true)).join('')}</div>
    <h3 class="sh">Unburied corpses</h3><div class="cards popcards">${P.corpses.map(id => cardSVG(id, {dead: true})).join('') || '<span class="muted">none</span>'}</div>`});
}
function showExit() {
  const S = UI.S, ec = exitCounts(S);
  modal({title: `Exit Stack (${S.exit.length})`, body: `<p>${['blue', 'red', 'purple', 'green', 'grey'].map(c => `<span class="chip" style="--c:${COL_HEX[c]}">${COLOR_NAMES[c]} ${ec[c] || 0}</span>`).join(' ')}</p>
    <p class="muted">Travelers who left the inn alive and accomplices spent on actions. ${S.season === 1 ? 'When the Entrance Stack runs out, this stack is shuffled into the new one.' : 'At the end of the game the Park, Grocery, Bishopric and Stables pay 4F per card of their colour here.'}</p>
    <div class="cards popcards">${S.exit.slice().sort((a, b) => COLORS.indexOf(T(a).color) - COLORS.indexOf(T(b).color) || T(a).rank - T(b).rank).map(id => cardSVG(id)).join('')}</div>`, cls: 'wide'});
}
function showEntrance() {
  const S = UI.S, top = S.entrance[0];
  modal({title: `Entrance Stack (${S.entrance.length})`, body: `<div class="cardpop">${top ? cardSVG(top) : ''}<div><p>${top ? `The next traveler is the <b>${esc(T(top).name)}</b>: the stack is face up, so only its top card is known.` : 'The stack is empty.'}</p>
    <p>${S.season === 1 ? 'First season: when it runs out, the Exit Stack is shuffled into a new Entrance Stack.' : 'Second season: when it runs out, that round is the last one.'}</p><p class="muted">${S.removed.length} cards were set aside unseen at setup.</p></div></div>`});
}
function showExplain(k) {
  if (k === 'police') return modal({title: 'The police', body: `<p>If at least one policeman (grey) is still in a room of the inn at the end of the round, the police investigate: each player pays the village gravedigger 10F per unburied corpse (checks accepted), and those corpses are discarded.</p><p>Kill a policeman or bribe him to send the police away, or bury your corpses before the end of the round.</p>`});
  const S = UI.S;
  modal({title: `Round ${S.round}`, body: `<p>Season ${S.season} of 2${S.final ? ', <b>final round</b>' : ''}. ${S.entrance.length} cards are left in the Entrance Stack and ${S.exit.length} in the Exit Stack.</p>
    <p>Each round: the first player lodges travelers in every open room; everyone takes two actions in turn; then the police investigate, guests leave (1F per occupied room of your colour) and you pay 1F wages per card in hand.</p>
    <p class="muted">The game ends after the round in which the Entrance Stack runs out for the second time.</p>`});
}
function showBoard() {
  modal({title: 'The inn', cls: 'wide', body: `<div class="bigboard">${boardSVG(true)}</div><p class="muted">Discs on the Wealth Track show each player\u2019s cash (max 40F). Doors show who owns each room and any Room Service token.</p>`});
}

document.addEventListener('click', e => {
  if (!$('#game') || e.target.closest('.modal') || e.target.closest('#tour')) return;
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (UI.edit && e.target.closest('[data-e]')) return;
  switch (a) {
    case 'menu': return showMenu();
    case 'help': return showHelp();
    case 'mute': UI.mute = !UI.mute; store.set('mute', UI.mute); return renderGame();
    case 'tab': UI.tab = el.dataset.t; UI.sheetMin = false; return renderGame();
    case 'sheet': UI.sheetMin = !UI.sheetMin; return renderGame();
    case 'room': return onRoom(+el.dataset.i);
    case 'hand': return onHand(el.dataset.id);
    case 'corpse': return onCorpse(el.dataset.id);
    case 'annex': return onAnnex(+el.dataset.p, +el.dataset.i);
    case 'bistro': return onBistro();
    case 'entrance': return showEntrance();
    case 'exit': return showExit();
    case 'bigboard': return showBoard();
    case 'opt': return onOpt(el.dataset.o);
    case 'dest': return onAnnex(+el.dataset.p, +el.dataset.i);
    case 'undo': return undo();
    case 'player': return showPlayer(+el.dataset.p);
    case 'explain': return showExplain(el.dataset.k);
    case 'results': return showResult();
    case 'newgame': return landing();
    case 'jroom': UI.flash.add('r' + el.dataset.i); return renderGame();
    case 'dump': console.log(JSON.stringify(UI.S)); return toast('State written to the console');
  }
});

function save() { if (!UI.auto && !UI.practice && UI.S && !Q.has('test') && !UI.freeze) store.set('save', {S: UI.S, viewer: UI.viewer, seasonSnap: UI.seasonSnap}); }
const STATS0 = () => ({games: 0, byLevel: {}, byN: {}, best: 0, sum: 0, streak: 0, bestStreak: 0, solo: {games: 0, best: 0, ratings: {}}, pnp: 0, recent: []});
function recordStats(S) {

  st.games++;

  if (S.n === 1) {

    Object.assign(g, {opp: 'solo', total: tot, r: S.lost ? 'l' : 'w', rating: R.rating});
  } else if (h.length > 1) { st.pnp++; Object.assign(g, {opp: 'pnp', winner: R.rows.filter(r => r.rank === 1).map(r => r.name).join(' & ')}); }
  else {

    const shared = R.rows.filter(r => r.rank === 1).length > 1, r = me.rank === 1 ? (shared ? 't' : 'w') : 'l';
    const o = st.byLevel[level] || (st.byLevel[level] = {w: 0, l: 0, t: 0}); o[r]++;
    const on = st.byN[S.n] || (st.byN[S.n] = {w: 0, l: 0, t: 0}); on[r]++;
