<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>The Bloody Inn</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">

<meta name="description" content="Unofficial fan implementation of The Bloody Inn for personal play. Works offline.">
<style>
:root {
  --bg: #120d0b; --panel: #1d1511; --panel2: #271c16; --line: #3d2d22; --ink: #efe3c4; --muted: #a8977a; --gold: #e0b850; --blood: #b3161b; --ok: #5fbf6a;
  --fc: Georgia, 'Times New Roman', serif; --fs: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --top: 52px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--fs); -webkit-tap-highlight-color: transparent; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover:not([disabled]) { border-color: #6b513c; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button[disabled] { opacity: .45; cursor: not-allowed; }
button.primary { background: linear-gradient(#a11a1a, #7a1010); border-color: #c33; color: #fff4e4; font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; }
a { color: var(--gold); }
.muted { color: var(--muted); } .bad { color: #ff7b6b; }
h1, h2, h3 { font-family: var(--fc); font-weight: 700; margin: 0; }
.cfont { font-family: Georgia, serif; }
.spacer { flex: 1; }
kbd { background: var(--panel2); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 5px; padding: 1px 6px; font: 13px var(--fs); }
.toast { position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); background: rgba(20, 12, 10, .95); border: 1px solid var(--gold); padding: 10px 16px; border-radius: 10px; z-index: 90; white-space: pre-line; text-align: center; max-width: 90vw; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; transform: translate(-50%, 8px); } }

.landing .box { padding: 28px 26px; background: var(--panel); border-left: 1px solid var(--line); }
.landing h1 { font-size: 34px; color: #f3dfb5; letter-spacing: .5px; }
.landing .sub { color: var(--muted); font-style: italic; margin: 2px 0 18px; }
.field { margin: 12px 0; } .field > label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; } .seg button { flex: 1; padding: 7px 6px; } .seg button.on { background: #5a1212; border-color: #c33; }
label.check { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; color: var(--ink); font-size: 14px; } label.check input { margin-top: 3px; accent-color: var(--blood); }
details.seats summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.seatrow { display: flex; gap: 6px; align-items: center; margin: 6px 0; } .seatrow i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); flex: none; border: 2px solid #000; }
.seatrow input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
.seatrow select, .menu select { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 6px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; } .row button { flex: 1; }
.tourhint { font-size: 13px; color: var(--muted); }
.foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
.l-ver { position: fixed; left: 12px; bottom: 6px; margin: 0; font-size: 12px; color: var(--muted); }
.l-ver button { padding: 1px 6px; font-size: 12px; background: transparent; border-color: var(--line); color: var(--muted); }
@media (max-width: 759px) { .landing { grid-template-columns: 1fr; } .landing .art { min-height: 34vh; } .landing .box { border-left: 0; padding-bottom: 46px; } .l-ver { position: static; padding: 0 0 14px 26px; background: var(--panel); } }

/* ---------- top bar ---------- */
.top { height: var(--top); display: flex; align-items: center; gap: 6px; padding: 0 8px; background: #0c0806; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; position: relative; z-index: 5; }
.top::-webkit-scrollbar { display: none; }
.top > * { flex: none; } .top button { padding: 5px 9px; }
.top .title { font-family: var(--fc); font-weight: 700; color: #f3dfb5; margin-right: 4px; }
.menubtn { padding: 4px 6px !important; display: flex; }
.tpill { display: inline-flex; align-items: center; gap: 5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.tpill small { color: var(--muted); font-size: 11px; } .tpill em { color: #ff7b6b; font-style: normal; font-weight: 700; }
.tpill.turn i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
.tpill .bar { width: 46px; height: 5px; background: #000; border-radius: 3px; overflow: hidden; } .tpill .bar i { display: block; height: 100%; background: var(--gold); }
.tpill.cops { border-color: #c33; background: #3a0f0f; animation: copglow 1.6s infinite; }
@keyframes copglow { 50% { box-shadow: 0 0 10px #f33; } }
.money { position: relative; display: inline-flex; align-items: center; gap: 4px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px 3px 5px; font-size: 13px; }
.money i { width: 14px; height: 14px; border-radius: 50%; background: var(--pc); border: 2px solid #000; }
.money.big { font-size: 15px; border-color: var(--pc); } .money.act { box-shadow: 0 0 0 2px var(--pc); }
.money small { color: var(--muted); font-size: 11px; } .money .chk { font-size: 12px; }
.delta { position: absolute; right: -2px; top: -4px; font-weight: 800; font-size: 13px; animation: rise 1.7s forwards; pointer-events: none; text-shadow: 0 1px 2px #000; }
.delta.up { color: #8f8; } .delta.dn { color: #f88; }
@keyframes rise { from { transform: translateY(6px); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-16px); opacity: 0; } }

/* ---------- main layout ---------- */
.main { display: grid; grid-template-columns: 1fr minmax(310px, 370px); height: calc(100vh - var(--top)); height: calc(100dvh - var(--top)); }
.play { overflow: auto; padding: 10px; }
.side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.side .grab { display: none; }
.panelrest { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.tabs { display: flex; border-bottom: 1px solid var(--line); } .tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 9px 4px; }
.tabs button.on { color: var(--ink); box-shadow: inset 0 -3px var(--blood); }
.tabbody { overflow: auto; padding: 8px 10px 16px; flex: 1; }

/* ---------- inn ---------- */
.inn { max-width: 1100px; margin: 0 auto; }
.rooms { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.room { background: #241914; border: 2px solid var(--line); border-radius: 10px; padding: 4px; cursor: pointer; position: relative; transition: transform .12s; }
.room.shut { opacity: .4; }
.room .door { display: flex; align-items: center; gap: 4px; font-size: 12px; min-height: 22px; padding: 0 2px 3px; }
.room .door b { font-family: var(--fc); font-size: 14px; color: #f3dfb5; }
.keychip, .rschip { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 18px; border-radius: 4px; background: var(--c); border: 1px solid #000; font-size: 11px; }
.closed { color: var(--muted); font-size: 11px; } .cop { margin-left: auto; font-size: 15px; animation: copglow 1.6s infinite; border-radius: 50%; }
.slot { aspect-ratio: 100 / 140; display: flex; border-radius: 8px; }
.slot.g-no { box-shadow: 0 0 16px 4px rgba(225, 50, 45, .55); }
.slot.g-cop { box-shadow: 0 0 16px 4px rgba(70, 140, 255, .55); }
.slot.g-cheap { box-shadow: 0 0 16px 4px rgba(70, 205, 100, .55); }
.room.g-no { background-image: linear-gradient(rgba(225, 50, 45, .22), rgba(225, 50, 45, .10)); }
.room.g-cop { background-image: linear-gradient(rgba(70, 140, 255, .22), rgba(70, 140, 255, .10)); }
.room.g-cheap { background-image: linear-gradient(rgba(70, 205, 100, .22), rgba(70, 205, 100, .10)); }
.slot.g-cop.g-no { box-shadow: 0 0 10px 2px rgba(70, 140, 255, .5), 0 0 20px 5px rgba(225, 50, 45, .32); }
.slot.g-cop.g-cheap { box-shadow: 0 0 10px 2px rgba(70, 140, 255, .5), 0 0 20px 5px rgba(70, 205, 100, .32); }
.slot .card, .hc .card, .annex .card, .stack .card, .pcard .card { width: 100%; height: auto; display: block; }
.empty { flex: 1; border: 2px dashed #4a372a; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.tgt { outline: 3px solid var(--gold); outline-offset: 1px; box-shadow: 0 0 14px rgba(224, 184, 80, .55); animation: pulse 1.6s infinite; }
.room.tgt:hover, .hc.tgt:hover { transform: translateY(-2px); }
.chosen { outline: 3px solid #ff4a3a !important; box-shadow: 0 0 16px rgba(255, 60, 40, .6) !important; animation: none; }
.kcur { outline: 3px dashed #7fd3ff !important; outline-offset: 3px; }
@keyframes pulse { 50% { box-shadow: 0 0 4px rgba(224, 184, 80, .25); } }
.fl { animation: flash 1.1s; } @keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px #fff3b0, 0 0 22px #ffd24a; } }
.noanim *, .noanim *::before { animation: none !important; transition: none !important; }
.mid { display: grid; grid-template-columns: 74px 1fr 74px; gap: 8px; align-items: center; margin: 8px 0; }
.boardwrap { position: relative; cursor: zoom-in; } .boardwrap svg { width: 100%; height: auto; display: block; border-radius: 8px; }
.bigb { position: absolute; right: 4px; top: 4px; padding: 0 6px !important; background: rgba(0, 0, 0, .55) !important; z-index: 1; }
.board .bistro { cursor: pointer; } .board .bistro.tgt { animation: none; outline: none; box-shadow: none; }
.stack { position: relative; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; }
.stack .cnt { position: absolute; top: 2px; right: 2px; background: #000; border: 1px solid var(--gold); border-radius: 999px; font-size: 12px; padding: 0 6px; font-weight: 700; }
.stack .lab { font-size: 11px; color: var(--muted); } .stack .big { font-size: 28px; line-height: 1.2; }
.stack .empty { width: 100%; min-height: 60px; font-size: 10px; }
.stk2 { display: flex; flex-direction: column; gap: 6px; }

.cl-new { background: var(--blood); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 999px; font-family: var(--fs); }

<div id="app"></div>
<script>
// ===== Static game data: card types, deck sizes, board coordinates. =====
// Card types. id | name | colour | rank | pocket money (F) | copies | annex | effect key | annex text
const TYPES_TXT = `
newsboy|Newsboy|blue|0|8|4|Kiosk|kiosk|Immediately earn 1F per blue annex you have built, including this one.
representative|Representative|blue|1|12|4|Parlor|parlor|From now on, play 1 accomplice fewer to perform the Bribe a Guest action.
concierge|Concierge|blue|2|18|3|Room Service|roomservice|Immediately place a Room Service token next to a Key token. From now on, when a Guest rents this room, he immediately pays a sum equal to his rank.
grocer|Grocer|blue|3|26|1|Grocery|grocery|Immediately earn 4F. At the end of the game, earn 4F per blue card in the Exit Stack.
shopkeeper|Shopkeeper|blue|3|26|1|Store|store|From now on, you can bribe as many travelers as you want in one Bribe a Guest action.
brewer|Brewer|blue|3|26|1|Brewery|brewery|From now on, you can bribe up to four peasants simultaneously in one Bribe a Guest action.

distiller|Distiller|red|2|18|3|Distillery|distillery|At the end of each round, do not pay the wages for one of the accomplices in your hand.
landscaper|Landscaper|red|3|26|1|Park|park|Immediately earn 4F. At the end of the game, earn 4F per red card in the Exit Stack.
gardener|Gardener|red|3|26|1|Gardens|gardens|At the end of each round, earn an additional 2F during the Travelers Leave phase.
butcher|Butcher|red|3|26|1|Butcher's Shop|butcher|From now on, you can kill as many travelers as you want in one Kill a Guest action.
novice|Novice|purple|0|8|4|Altar|altar|Immediately earn 1F per purple annex you have built, including this one.
monk|Monk|purple|1|12|4|Room|room|Immediately replace one of the white Key tokens with one of your Key tokens.
abbot|Abbot|purple|2|18|3|Cellar|cellar|From now on, play 1 accomplice fewer to perform the Bury a Corpse action.
priest|Priest|purple|3|26|1|Chapel|chapel|From now on, you are not required to discard accomplices of the other types when you use them for a Bury a Corpse action.
bishop|Bishop|purple|3|26|1|Bishopric|bishopric|Immediately earn 4F. At the end of the game, earn 4F per purple card in the Exit Stack.
archbishop|Archbishop|purple|3|26|1|Crypt|crypt|From now on, you can bury as many corpses as you want in one Bury a Corpse action.
baron|Baron|green|0|8|4|Large Chandelier|chandelier|Immediately earn 4F.
viscount|Viscount|green|1|12|4|King Size Bed|bed|Immediately earn 6F.
count|Count|green|2|18|3|Dining Room|dining|Immediately earn 9F.
duke|Duke|green|3|26|1|Stables|stables|Immediately earn 4F. At the end of the game, earn 4F per green card in the Exit Stack.
marquis|Marquis|green|3|26|1|Detached House|detached|Immediately earn 18F.
prince|Prince|green|3|26|1|Greenhouse|greenhouse|At the end of the game, earn 3F per check you have.
peacekeeper|Peacekeeper|grey|0|8|4|||
brigadier|Brigadier|grey|1|12|4|||
chief|Brigadier Chief|grey|2|18|3|||
major|Major|grey|3|26|3|||
peasant|Peasant|yellow|0|4|8|||
`;
const TYPES = {};
for (const line of TYPES_TXT.trim().split('\n')) {
  const [id, name, color, rank, money, count, annex, effect, text] = line.split('|');
  TYPES[id] = {id, name, color, rank: +rank, brank: +rank, money: +money, count: +count, annex: annex || null, effect: effect || null, text: text || '', apt: null, module: 'base'};
}
// The Carnies expansion. rank = top rank (in a room: bribe, kill, Room Service, Coffee, Cake); brank = bottom rank (bury, build, annex capacity).
// id | name | colour | rank | brank | money | copies | annex | effect | aptitude | module | annex text
const EXP_TXT = `
actress|Actress|orange|1|0|10|1|||bribe|carnies|
strongman|Strongman|orange|1|0|10|1|||build|carnies|
fortuneteller|Fortune Teller|orange|1|0|10|1|||bury|carnies|
knifethrower|Knife Thrower|orange|1|0|10|1|||kill|carnies|

illusionist|Illusionist|orange|0|2|14|1|Trailer|trailer||carnies|When welcoming travelers, if there are no corpses buried under this trailer, you must place a traveler on it.
juggler|Juggler|orange|0|2|14|1|Trailer|trailer||carnies|When welcoming travelers, if there are no corpses buried under this trailer, you must place a traveler on it.
fireeater|Fire Eater|orange|0|2|14|1|Trailer|trailer||carnies|When welcoming travelers, if there are no corpses buried under this trailer, you must place a traveler on it.
dwarf|Dwarf|orange|2|1|16|1||||carnies|When buried, place the dwarf sideways under an annex. It does not count toward the maximum number of corpses that can be buried under the annex.
beartamer|Bear Tamer|orange|3|1|20|1|Bear Cage|bearcage||carnies|From now on, play 1 fewer accomplice to perform the Kill a Guest action.
twins|Twins|orange|2|1|24|1||||carnies|When buried, the twins must be placed under an annex where at least 2 corpses can be buried. They count as 2 corpses.
beardedlady|Bearded Lady|orange|2|1|24|1||||carnies|When buried, the bearded lady must be placed under another player's annex.
barker|Barker|orange|1|3|20|1|Carnival Booth|booth||carnies|From now on, gain 3F each time you bribe a carnie.
companion|Companion|orange|3|1|20|1|Nook|nook||carnies|From now on, you are not required to discard accomplices of the other types when you play them to perform the Bribe a Guest action.
winemaker|Winemaker|green|2|0|14|4|Wine Cask|winecask||notables|Immediately gain 3F per neutral room occupied by a traveler.
sericulturist|Sericulturist|green|0|1|10|4|Silk Farm|silkfarm||notables|Immediately gain 3F per room of your color occupied by a traveler (excluding trailers).
surgeon|Surgeon|green|1|2|16|3|Laboratory|laboratory||notables|From now on, each time travelers leave, gain 3F if another player has an unburied corpse.
notary|Notary|green|3|1|20|1|Study|study||notables|From now on, each time another player exchanges money for checks, you may immediately exchange 10F for a 10F check.
pharmacist|Pharmacist|green|1|3|20|1|Pharmacy|pharmacy||notables|From now on, each time travelers leave, gain 2F if another player has at least 3 accomplices.
banker|Banker|green|1|3|20|1|Safe|safe||notables|From now on, each time another player exceeds the 40F limit on the Wealth Track, gain the excess.
`;

const Engine = (() => {
  // ---------- helpers ----------
  function rnd(S) {
    let t = (S.rng = (S.rng + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function shuffle(S, a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd(S) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const pname = (S, p) => (S.seats[p] && S.seats[p].name) || `Player ${p + 1}`;
  function log(S, text, kind = '', p = null, extra) {
    if (S.sim) return;
    S.log.push({round: S.round, p, text, kind, ...extra});
  }
  const isFiller = id => id[0] === '~';                  // the face-down card that fills the Twins' second slot
  const rank = id => T(id).rank;                         // top rank: in a room
  const brank = id => T(id).brank;                       // bottom rank: outside the rooms
  const color = id => T(id).color;
  const apt = id => T(id).apt || APTITUDE[color(id)] || null;
  const isPolice = id => color(id) === 'grey';
  const isPeasant = id => CARDS[id].type === 'peasant';
  const isCarnie = id => color(id) === 'orange';
  const special = id => isFiller(id) ? null : SPECIAL_BURIAL[CARDS[id].type] || null;
  const weight = id => isFiller(id) ? 0 : special(id) === 'twins' ? 2 : special(id) === 'dwarf' ? 0 : 1;
  const canAnnex = id => !!T(id).annex;
  const count = (P, eff) => P.annexes.reduce((n, a) => n + (a.id !== 'barn' && T(a.id).effect === eff ? 1 : 0), 0);
  const colorAnnexes = (P, col) => P.annexes.filter(a => a.id !== 'barn' && color(a.id) === col).length;
  const annexRank = a => a.id === 'barn' ? BARN_RANK : brank(a.id);
  const annexFree = a => annexRank(a) - a.under.reduce((n, id) => n + (isFiller(id) ? 1 : special(id) === 'dwarf' ? 0 : special(id) === 'twins' ? 1 : 1), 0);
  const order = S => Array.from({length: S.n}, (_, i) => (S.first + i) % S.n);
  const after = (S, p) => Array.from({length: S.n - 1}, (_, i) => (p + 1 + i) % S.n);
  const guestsInInn = S => S.rooms.filter(r => r.guest).length;
  const openRooms = S => S.rooms.map((r, i) => r.key !== null ? i : -1).filter(i => i >= 0);
  const wealth = P => P.cash + 10 * P.checks;
  const buriedUnder = P => P.annexes.reduce((n, a) => n + a.under.length, 0);
  const keysOf = (S, p) => S.rooms.filter(r => r.key === p).length;
  const mods = S => S.opts.mods || {};
  const isTrailer = R => R.trailer != null;
  const annexOfRoom = (S, R) => isTrailer(R) ? S.players[R.key].annexes.find(a => a.uid === R.trailer) : null;
  const roomOfAnnex = (S, a) => a.inn ? S.rooms.findIndex(R => R.trailer === a.uid) : -1;
  const evLive = (S, id) => !!(S.ev && S.ev.live && S.ev.cur === id);
  const payable = P => P.corpses.filter(c => c !== P.snow);
  const objs = P => P.objects || [];
  function mkAnnex(S, id) { S.uid = (S.uid || 0) + 1; return {id, under: [], uid: S.uid}; }

  function gain(S, p, amt, fromSafe) {
    if (amt <= 0) return 0;
    const P = S.players[p];
    if (S.opts.unlimited) {
      P.cash += amt;
      while (P.cash > CASH_CAP) { P.cash -= CASH_CAP; P.checks += 4; }
      return amt;
    }
    const got = Math.min(amt, CASH_CAP - P.cash);
    P.cash += got;
    if (got < amt) {
      const x = amt - got, q = fromSafe ? undefined : after(S, p).find(q => count(S.players[q], 'safe'));
      if (q !== undefined) {
        const g = gain(S, q, x, true);
        log(S, `Safe: ${pname(S, q)} collects ${g}F of the excess over 40F.`, 'money', q);
      } else P.wasted = (P.wasted || 0) + x;
    }
    return got;
  }
  function payCash(S, p, amt) { const P = S.players[p]; const paid = Math.min(P.cash, amt); P.cash -= paid; return paid; }

  // ---------- setup ----------
  function newGame(o = {}) {
    const seed = (o.seed ?? Math.floor(Math.random() * 2 ** 31)) >>> 0;
    const seats = o.seats || [{name: 'You', type: 'human', level: 'normal'}, {name: 'Anna', type: 'ai', level: 'normal'},
      {name: 'Madeline', type: 'ai', level: 'normal'}, {name: 'Sebastien', type: 'ai', level: 'normal'}];
    const n = seats.length, m = o.mods || {};
    const md = {notables: !!m.notables, carnies: !!m.carnies, events: !!(m.events && m.carnies), objects: !!m.objects, check50: !!m.check50};
    const S = {
      v: 2, seed, rng: seed, n, seats: seats.map((s, i) => ({color: SEAT_COLORS[i], ...s})),
      opts: {long: o.long !== false, unlimited: !!o.unlimited, fcfs: !!o.fcfs, mods: md},
      players: [], rooms: Array.from({length: 8}, () => ({key: null, rs: null, guest: null})),
      entrance: [], exit: [], bistro: [], removed: [], box: [], first: 0, round: 1, empties: 0, season: 1, final: false,
      queue: [], pending: null, active: null, turnNo: 0, actRound: 0, draws: 0, log: [], last: null, over: false, lost: false, result: null, sim: false,
      uid: 0, rnd: {letter: false, calls: false, invest: false}, ev: null, objUsed: [], objBox: [],
    };
    const deck = shuffle(S, deckFor(md));
    S.removed = deck.splice(0, REMOVE[n][S.opts.long ? 'long' : 'short']);
    S.entrance = deck;
    const peas = PEASANT_IDS.slice();          // peasant1-4 and peasant5-8 are the two illustrations
    for (let p = 0; p < n; p++) {
      S.players.push({cash: START_CASH, checks: START_CHECKS, hand: [peas[p], peas[p + 4]], annexes: [mkAnnex(S, 'barn')], corpses: [], wasted: 0, objects: [], snow: null});
    }
    const spare = PEASANT_IDS.filter(id => !S.players.some(P => P.hand.includes(id)));
    if (n === 1) S.bistro.push(spare.shift(), spare.shift());
    S.box.push(...spare);
    let r = 0;
    for (let p = 0; p < n; p++) S.rooms[r++].key = p;
    for (let k = 0; k < NEUTRAL_KEYS[n]; k++) S.rooms[r++].key = 'white';
    if (md.events) S.ev = {deck: shuffle(S, Object.keys(EVENTS)), discard: [], cur: null, live: false};
    S.first = Math.floor(rnd(S) * n);
    if (md.objects) {
      const pile = shuffle(S, OBJECT_IDS.slice());
      S.draft = {hands: S.players.map(() => pile.splice(0, 4))};
      S.objBox.push(...pile);
      for (let step = 0; step < 3; step++) {
        for (let p = 0; p < n; p++) S.queue.push({k: 'draft', p, step});
        S.queue.push({k: 'draftPass'});
      }
      S.queue.push({k: 'draftEnd'});
    }
    log(S, `${pname(S, S.first)} is the greediest and starts. Round 1.`, 'round');
    queueRound(S);
    advance(S);
    return S;
  }

  function queueRound(S) {
    S.rnd = {letter: false, calls: false, invest: false};
    S.queue.push({k: 'welcome'});
    if (mods(S).objects) S.queue.push({k: 'window', when: 'welcome'});
    for (let ar = 0; ar < 2; ar++) for (const p of order(S)) S.queue.push({k: 'turn', p, ar});
    S.queue.push({k: 'phase3'}, {k: 'police'}, {k: 'leave'}, {k: 'late'});
    for (const p of order(S)) S.queue.push({k: 'wages', p});
    S.queue.push({k: 'afterWages'});
    if (mods(S).objects) S.queue.push({k: 'window', when: 'end'});
    S.queue.push({k: 'roundEnd'});
  }

  // ---------- the task queue ----------
  function advance(S) {
    let guard = 0;
    while (!S.pending && !S.over && S.queue.length) {
      if (++guard > 5000) throw new Error('advance loop');
      run(S, S.queue.shift());
    }
  }

  function draw(S) {
    const id = S.entrance.shift();
    S.draws++;
    if (!S.entrance.length) {
      S.empties++;
      if (S.empties === 1) {
        S.entrance = shuffle(S, S.exit.splice(0));
        S.season = 2;
        log(S, 'The Entrance Stack is empty: the Exit Stack is shuffled into a new one. Second season.', 'season');
        if (!S.entrance.length) { S.empties = 2; S.final = true; }
      }
      if (S.empties >= 2 && !S.final) S.final = true;
      if (S.final) log(S, 'The Entrance Stack is empty for the second time: this is the final round.', 'season');
    }
    return id;
  }

  const roomName = (S, i) => isTrailer(S.rooms[i]) ? `${pname(S, S.rooms[i].key)}\u2019s trailer` : `room ${i + 1}`;
  function lodge(S, id, room) {
    const R = S.rooms[room];
    R.guest = id;
    log(S, `${T(id).name} takes ${roomName(S, room)}.`, 'lodge', null, {room});
    if (R.rs !== null) {
      const got = gain(S, R.rs, rank(id));
      if (rank(id)) log(S, `Room service: ${pname(S, R.rs)} earns ${got}F.`, 'money', R.rs);
    }
    if (S.ev && !S.ev.cur && isCarnie(id)) {
      if (!S.ev.deck.length) S.ev.deck = shuffle(S, S.ev.discard.splice(0));
      S.ev.cur = S.ev.deck.shift();
      log(S, `A carnie arrives: the event ${EVENTS[S.ev.cur].name} is revealed. It takes effect if a carnie is still in the inn at the end of the round.`, 'event');
    }
  }
  function vacate(R) { const id = R.guest; R.guest = null; R.cake = null; R.coffee = null; return id; }

  function run(S, t) {
    switch (t.k) {
      case 'draft': {
        S.pending = {t: 'draft', p: t.p, step: t.step, opts: S.draft.hands[t.p].slice()}; S.active = t.p;
        return;
      }
      case 'draftPass': {
        const h = S.draft.hands;
        S.draft.hands = h.map((_, p) => h[(p - 1 + S.n) % S.n]);
        return;
      }
      case 'draftEnd': {
        for (const hand of S.draft.hands) S.objBox.push(...hand);
        S.draft = null;
        S.players.forEach((P, p) => { P.cash = OBJ_START_CASH - P.objects.reduce((n, o) => n + OBJECTS[o].cost, 0); });
        log(S, 'Every innkeeper keeps 3 secret objects and starts with 10F minus their cost.', 'round');
        return;
      }
      case 'welcome': {
        const free = openRooms(S).filter(i => !S.rooms[i].guest);
        if (free.length && S.entrance.length) {
          const id = draw(S);
          S.queue.unshift({k: 'welcome'});
          if (S.opts.fcfs || free.length === 1) lodge(S, id, free[0]);
          else { S.pending = {t: 'lodge', p: S.first, card: id}; S.active = S.first; }
          return;
        }
        if (S.final && guestsInInn(S) < S.n) {
          for (const R of S.rooms) if (R.guest) S.exit.push(vacate(R));
          log(S, 'Fewer travelers than players in the inn: the last round is not played.', 'season');
          S.queue = [];
          queueFinish(S);
        }
        return;
      }
      case 'window': S.queue.unshift(...order(S).map(p => ({k: 'objwin', p, when: t.when}))); return;
      case 'objwin':
        if (objOptions(S, t.p, t.when).length) { S.pending = {t: 'objects', p: t.p, when: t.when}; S.active = t.p; }
        return;
      case 'study':
        if (S.players[t.p].cash >= 10) { S.pending = {t: 'study', p: t.p}; S.active = t.p; }
        return;
      case 'turn': {
        S.active = t.p; S.actRound = t.ar; S.turnNo++;
        S.pending = {t: 'turn', p: t.p, ar: t.ar};
        return;
      }
      case 'phase3': {
        if (S.ev && S.ev.cur) {
          S.ev.live = S.rooms.some(R => R.guest && isCarnie(R.guest));
          log(S, S.ev.live ? `Event ${EVENTS[S.ev.cur].name}: ${EVENTS[S.ev.cur].text.replace(/^At the end of the round, /, '')}`
            : `No carnie is left in the inn: the event ${EVENTS[S.ev.cur].name} is discarded.`, 'event');
        }
        return;
      }
      case 'police': {
        const cops = S.rooms.filter(R => R.guest && isPolice(R.guest));
        const herring = evLive(S, 'redherring');
        S.rnd.invest = cops.length > 0 && !herring;
        if (cops.length && herring) log(S, 'Red Herring: the police do not investigate this round.', 'police');
        if (S.rnd.invest) log(S, `The police investigate (${cops.map(R => T(R.guest).name).join(', ')}).`, 'police');
        if (S.rnd.letter) log(S, 'The Letter of Denunciation: every innkeeper with an unburied corpse calls the gravedigger.', 'police');
        if (evLive(S, 'blackmail')) log(S, 'Blackmail: every innkeeper with an unburied corpse calls the gravedigger.', 'police');
        S.rnd.calls = S.rnd.invest || S.rnd.letter || evLive(S, 'blackmail');
        if (!S.rnd.calls) return;
        S.queue.unshift(...(mods(S).objects ? [{k: 'window', when: 'police'}] : []), {k: 'police2'});
        return;
      }
      case 'police2': {
        if (S.n === 1 && S.rnd.invest && payable(S.players[0]).length) { lose(S, 'The police found an unburied corpse.'); return; }
        S.queue.unshift(...order(S).filter(p => payable(S.players[p]).length).map(p => ({k: 'grave', p, why: 'police'})));
        return;
      }
      case 'grave': return gravedigger(S, t.p, t.why);
      case 'leave': {
        const per = evLive(S, 'highseason') ? 4 : 1;
        for (let p = 0; p < S.n; p++) {
          const P = S.players[p], occ = S.rooms.filter(R => R.key === p && R.guest).length, g = 2 * count(P, 'gardens');
          const lab = count(P, 'laboratory') && S.players.some((Q, q) => q !== p && payable(Q).length) ? 3 * count(P, 'laboratory') : 0;
          const tot = occ * per + g + lab;
          const got = gain(S, p, tot);
          if (tot) log(S, `${pname(S, p)} earns ${got}F (${occ} occupied room${occ === 1 ? '' : 's'}${per > 1 ? ' at 4F' : ''}${g ? `, gardens +${g}` : ''}${lab ? `, laboratory +${lab}` : ''}).`, 'money', p);
        }
        for (const R of S.rooms) if (R.cake != null && R.guest) {
          const got = gain(S, R.cake, 2 * rank(R.guest));
          log(S, `Cake: ${T(R.guest).name} is still there, ${pname(S, R.cake)} earns ${got}F.`, 'money', R.cake);
        }
        for (const R of S.rooms) if (R.guest) S.exit.push(vacate(R)); else { R.cake = null; R.coffee = null; }
        S.players.forEach((P, p) => { if (P.snow) { log(S, `${pname(S, p)}\u2019s snow pile melts: ${T(P.snow).name} is an unburied corpse again.`, 'leave', p); P.snow = null; } });
        log(S, 'The travelers leave the inn.', 'leave');
        return;
      }
      case 'late': {
        if (evLive(S, 'brokensafe')) S.players.forEach((P, p) => { const k = Math.ceil(P.checks / 2); if (k) { P.checks -= k; log(S, `Broken Safe: ${pname(S, p)} loses ${k} check${k === 1 ? '' : 's'}.`, 'wages', p); } });
        if (evLive(S, 'fiasco')) S.players.forEach((P, p) => { if (P.hand.length) release(S, p, P.hand.slice(), 'Fiasco: '); });
        S.players.forEach((P, p) => {
          const c = count(P, 'pharmacy');
          if (c && S.players.some((Q, q) => q !== p && Q.hand.length >= 3)) { const got = gain(S, p, 2 * c); log(S, `Pharmacy: ${pname(S, p)} earns ${got}F.`, 'money', p); }
        });
        if (evLive(S, 'pickpockets')) S.players.forEach((P, p) => { const k = Math.ceil(P.cash / 2); if (k) { P.cash -= k; log(S, `Pickpockets: ${pname(S, p)} loses ${k}F.`, 'wages', p); } });
        return;
      }
      case 'wages': {
        const P = S.players[t.p], w = evLive(S, 'extortion') ? 2 : 1, n = Math.max(0, P.hand.length - count(P, 'distillery')), due = w * n;
        if (!due) return;
        const why = w > 1 ? ' (Extortion: twice)' : '';
        if (P.cash >= due) { P.cash -= due; log(S, `${pname(S, t.p)} pays ${due}F in wages${why}.`, 'wages', t.p); return; }
        const units = Math.floor(P.cash / w), paid = units * w; P.cash -= paid;
        const k = n - units;
        log(S, `${pname(S, t.p)} can only pay ${paid}F in wages${why}: ${k} accomplice${k === 1 ? '' : 's'} must go.`, 'wages', t.p);
        if (k >= P.hand.length) { release(S, t.p, P.hand.slice()); return; }
        S.pending = {t: 'release', p: t.p, k}; S.active = t.p;
        return;
      }
      case 'afterWages': {
        if (evLive(S, 'cirrhosis') && S.bistro.length) { S.box.push(S.bistro.pop()); log(S, 'Cirrhosis: a peasant leaves the bistro for good.', 'wages'); }
        return;
      }
      case 'roundEnd': {
        if (S.ev && S.ev.cur) { S.ev.discard.push(S.ev.cur); S.ev.cur = null; S.ev.live = false; }
        if (S.final) { queueFinish(S); return; }
        S.first = (S.first + 1) % S.n;
        S.round++;
        log(S, `Round ${S.round}. ${pname(S, S.first)} welcomes the travelers.`, 'round');
        queueRound(S);
        return;
      }
      case 'score': return score(S);
    }
  }

  function queueFinish(S) {
    S.phase = 'final';
    if (S.n === 1 && S.players[0].corpses.length) { lose(S, 'An unburied corpse was found at the end of the game.'); return; }
    S.queue.push(...order(S).filter(p => S.players[p].corpses.length).map(p => ({k: 'grave', p, why: 'end'})), {k: 'score'});
  }

  function lose(S, why) {
    S.over = true; S.lost = true; S.pending = null; S.queue = [];
    log(S, `You lose: ${why}`, 'end');
    S.result = result(S);
  }

  // Gravedigger: 10F per unburied corpse, from a check or 10 cash each (player's choice); if both run out, all remaining cash.
  function graveRange(P, k = payable(P).length) {
    const maxC = Math.min(P.checks, k);
    // fewest checks: as many 10F units from cash as possible; any shortfall must use checks first
    const minC = Math.min(maxC, Math.max(0, k - Math.floor(P.cash / 10)));
    return [minC, maxC];
  }
  function gravedigger(S, p, why) {
    const P = S.players[p];
    if (!payable(P).length) return;
    const [lo, hi] = graveRange(P);
    if (lo === hi) { payGrave(S, p, lo); return; }
    S.pending = {t: 'grave', p, why, lo, hi}; S.active = p;
  }
  function payGrave(S, p, c) {
    const P = S.players[p], dead = payable(P), k = dead.length;
    P.checks -= c;
    const cash = payCash(S, p, (k - c) * 10);
    log(S, `${pname(S, p)} pays the gravedigger for ${k} corpse${k === 1 ? '' : 's'}: ${[c ? `${c} check${c === 1 ? '' : 's'}` : '', cash ? `${cash}F` : ''].filter(Boolean).join(' and ') || 'nothing left to pay'}.`, 'police', p);
    P.corpses = P.corpses.filter(id => !dead.includes(id));
    S.box.push(...dead);
  }

  function release(S, p, ids, why = '') {
    const P = S.players[p];
    for (const id of ids) {
      P.hand.splice(P.hand.indexOf(id), 1);
      if (isPeasant(id)) S.bistro.push(id); else S.exit.push(id);
    }
    log(S, `${why}${pname(S, p)} lets go of ${ids.map(id => T(id).name).join(', ')}.`, 'wages', p);
  }

  function score(S) {
    const bonus = [];
    for (let p = 0; p < S.n; p++) {
      const P = S.players[p], b = {};
      const per = (eff, col) => { const c = count(P, eff); if (c) b[eff] = gain(S, p, 4 * c * S.exit.filter(id => color(id) === col).length); };
      per('park', 'red'); per('grocery', 'blue'); per('bishopric', 'purple'); per('stables', 'green');
      const gh = count(P, 'greenhouse');
      if (gh) b.greenhouse = gain(S, p, 3 * gh * P.checks);
      bonus.push(b);
      const tot = Object.values(b).reduce((a, v) => a + v, 0);
      if (tot) log(S, `${pname(S, p)} earns ${tot}F from end-of-game annexes.`, 'money', p);
    }
    S.bonus = bonus;
    S.over = true; S.pending = null; S.phase = 'over';
    S.result = result(S);
    const w = S.result.rows.filter(r => r.rank === 1);
    log(S, S.n === 1 ? `Final booty: ${S.result.rows[0].total}F, ${S.result.rating}.`
      : `${w.map(r => r.name).join(' and ')} ${w.length > 1 ? 'share the victory' : 'wins'} with ${w[0].total}F.`, 'end');
  }

  function result(S) {
    const rows = S.players.map((P, p) => ({p, name: pname(S, p), color: S.seats[p].color, cash: P.cash, checks: P.checks, total: wealth(P),
      buried: buriedUnder(P), annexes: P.annexes.length - 1, corpses: P.corpses.length, hand: P.hand.length, bonus: (S.bonus && S.bonus[p]) || {}}));
    for (const r of rows) r.rank = 1 + rows.filter(o => o.total > r.total || (o.total === r.total && o.buried > r.buried)).length;
    const out = {rows, over: S.over, lost: S.lost, round: S.round};
    if (S.n === 1) out.rating = S.lost ? 'arrested' : SOLO_RATINGS.find(([m]) => rows[0].total >= m)[1];
    return out;
  }

  // ---------- costs and options ----------
  const buildCard = (S, m) => m.room != null ? S.rooms[m.room] && S.rooms[m.room].guest : m.card;
  function cost(S, p, m) {
    const P = S.players[p];
    switch (m.t) {
      case 'bribe': return Math.max(0, m.rooms.reduce((n, i) => n + rank(S.rooms[i].guest), 0) - count(P, 'parlor'));
      case 'build': return Math.max(0, brank(buildCard(S, m)) - count(P, 'workshop'));
      case 'kill': return Math.max(0, m.rooms.reduce((n, i) => n + rank(S.rooms[i].guest), 0) - count(P, 'bearcage'));
      case 'bury': return Math.max(0, m.items.reduce((n, it) => n + brank(it.id), 0) - count(P, 'cellar'));
      default: return 0;
    }
  }
  const actionOf = m => ({bribe: 'bribe', peasants: 'bribe', build: 'build', kill: 'kill', killPeasant: 'kill', bury: 'bury'}[m.t]);
  // Where a paid card goes: back to hand (aptitude, or every card with a Chapel, Nook or no-discard object), bistro (peasants) or the Exit Stack.
  function payDest(S, p, action, id, used = []) {
    const P = S.players[p];
    if (action === 'bury' && (count(P, 'chapel') || used.includes('bible'))) return 'hand';
    if (action === 'bribe' && (count(P, 'nook') || used.includes('liquor'))) return 'hand';
    if (action === 'build' && used.includes('hammer')) return 'hand';
    if (action === 'kill' && used.includes('wolftrap')) return 'hand';
    if (apt(id) === action) return 'hand';
    return isPeasant(id) ? 'bistro' : 'exit';
  }

  // Legal targets for the UI and the AI: what the actor may start this turn.
  function options(S, p) {
    const P = S.players[p], hand = P.hand.length;
    const occ = S.rooms.map((R, i) => R.guest && R.coffee == null ? i : -1).filter(i => i >= 0);
    const o = {bribe: [], kill: [], build: [], bury: [], wheel: [], peasants: 0, killPeasant: false,
      multiBribe: count(P, 'store') > 0, multiKill: count(P, 'butcher') > 0, multiBury: count(P, 'crypt') > 0};
    const trailerOk = id => T(id).effect !== 'trailer' || keysOf(S, p) < MAX_KEYS;
    for (const i of occ) {
      if (cost(S, p, {t: 'bribe', rooms: [i]}) <= hand) o.bribe.push(i);
      if (cost(S, p, {t: 'kill', rooms: [i]}) <= hand) o.kill.push(i);
      const g = S.rooms[i].guest;
      if (objs(P).includes('wheelbarrow') && canAnnex(g) && trailerOk(g) && cost(S, p, {t: 'build', room: i}) <= hand) o.wheel.push(i);
    }
    for (const id of P.hand) if (canAnnex(id) && trailerOk(id) && cost(S, p, {t: 'build', card: id}) <= hand - 1) o.build.push(id);
    for (const id of P.corpses) if (annexTargets(S, [], id, p).length && cost(S, p, {t: 'bury', items: [{id}]}) <= hand) o.bury.push(id);
    o.peasants = Math.min(S.bistro.length, count(P, 'brewery') ? 4 : 2);
    o.killPeasant = S.bistro.length > 0;
    return o;
  }

  function annexTargets(S, extra = [], id = null, p = null) {
    // [{p, i, free}]: annexes that can take this corpse, accounting for corpses already assigned in this action
    const sp = id ? special(id) : null, need = sp === 'twins' ? 2 : sp === 'dwarf' ? 0 : 1, out = [];
    S.players.forEach((Q, q) => Q.annexes.forEach((a, i) => {
      if (a.inn && S.rooms.some(R => R.trailer === a.uid && R.guest)) return;
      if (sp === 'lady' && q === p) return;
      const free = annexFree(a) - extra.filter(e => e.owner === q && e.annex === i).reduce((n, e) => n + weight(e.id), 0);
      if (sp === 'dwarf' || free >= need) out.push({p: q, i, free});
    }));
    return out;
  }

  // Objects that can be played now, outside an action: [{id, room?, corpse?, to?, owner?}].
  function objOptions(S, p, when) {
    const P = S.players[p], has = id => objs(P).includes(id), out = [];
    if (S.over || !objs(P).length) return out;
    if (when === 'welcome') {
      S.rooms.forEach((R, i) => {
        if (!R.guest) return;
        if (has('coffee') && R.coffee == null) out.push({id: 'coffee', room: i});
        if (has('cake') && R.cake == null) out.push({id: 'cake', room: i});
        if (has('poison') && R.coffee == null) out.push({id: 'poison', room: i});
      });
      if (has('rug')) for (const c of P.corpses) for (let q = 0; q < S.n; q++) if (q !== p) out.push({id: 'rug', corpse: c, to: q});
      if (has('letter') && !S.rnd.letter) out.push({id: 'letter'});
    } else if (when === 'police') {
      if (!S.rnd.calls) return out;
      if (has('snowpile') && !P.snow) for (const c of payable(P)) out.push({id: 'snowpile', corpse: c});
      if (has('tomb')) S.players.forEach((Q, q) => { for (const c of payable(Q)) out.push({id: 'tomb', owner: q, corpse: c}); });
    } else if (when === 'end') {
      const max = Math.max(...S.players.map(buriedUnder));
      if (has('confessional') && buriedUnder(P) < max) out.push({id: 'confessional'});
    }
    return out;
  }
  const samePlay = (a, b) => ['id', 'room', 'corpse', 'to', 'owner'].every(k => a[k] === b[k]);

  // ---------- validation ----------
  function check(S, m) {
    const pd = S.pending;
    if (S.over) return 'The game is over.';
    if (!pd) return 'Nothing to decide.';
    const p = pd.p, P = S.players[p];
    const uniq = a => new Set(a).size === a.length;
    switch (pd.t) {
      case 'draft':
        if (m.t !== 'draft' || !pd.opts.includes(m.id)) return 'Choose one of the objects offered.';
        return '';
      case 'objects':
        if (m.t !== 'obj') return 'Play an object or carry on.';
        if (m.play && !objOptions(S, p, pd.when).some(o => samePlay(o, m.play))) return 'That object cannot be played like that now.';
        return '';
      case 'study':
        if (m.t !== 'study') return 'Answer the Study offer.';
        if (m.yes && P.cash < 10) return 'You need 10F.';
        return '';
      case 'lodge':
        if (m.t !== 'lodge') return 'Choose a room for the traveler.';
        if (!S.rooms[m.room] || S.rooms[m.room].key === null || S.rooms[m.room].guest) return 'That room is not open and free.';
        return '';
      case 'rs': {
        const R = S.rooms[m.room];
        if (m.t !== 'rs' || !R || R.key === null || R.rs !== null || isTrailer(R)) return 'Choose a door with a Key and no Room Service token.';
        return '';
      }
      case 'monk':
        if (m.t !== 'monk' || !S.rooms[m.room] || S.rooms[m.room].key !== 'white') return 'Choose a room with a white Key.';
        return '';
      case 'grave':
        if (m.t !== 'grave' || !(m.checks >= pd.lo && m.checks <= pd.hi)) return `Use between ${pd.lo} and ${pd.hi} checks.`;
        return '';
      case 'release':
        if (m.t !== 'release' || m.ids.length !== pd.k || !uniq(m.ids) || !m.ids.every(id => P.hand.includes(id))) return `Choose ${pd.k} accomplice${pd.k === 1 ? '' : 's'} from your hand.`;
        return '';
      case 'turn': break;
      default: return 'Unknown decision.';
    }
    if (m.t === 'pass') {
      const k = m.launder | 0;
      if (k > 0 && P.cash < 10 * k) return 'Not enough cash for that many checks.';
      if (k < 0 && P.checks < -k) return 'Not enough checks.';
      return '';
    }
    const pay = m.pay || [], used = m.objs || [];
    if (!uniq(pay) || !pay.every(id => P.hand.includes(id))) return 'Pay with distinct cards from your hand.';
    if (!uniq(used) || !used.every(o => objs(P).includes(o) && OBJECTS[o].when === actionOf(m))) return 'That object does not fit this action.';
    if (m.t === 'peasants' && used.length) return 'Bribing peasants costs nothing: no object needed.';
    switch (m.t) {
      case 'bribe': case 'kill': {
        if (!m.rooms || !m.rooms.length || !uniq(m.rooms)) return 'Choose a traveler.';
        if (!m.rooms.every(i => S.rooms[i] && S.rooms[i].guest)) return 'That room is empty.';
        if (m.rooms.some(i => S.rooms[i].coffee != null)) return 'That traveler has had his coffee: he cannot be bribed or killed this round.';
        const multi = count(P, m.t === 'bribe' ? 'store' : 'butcher') > 0;
        if (m.rooms.length > 1 && !multi) return `Only one traveler per action without the ${m.t === 'bribe' ? 'Store' : 'Butcher\u2019s Shop'}.`;
        break;
      }
      case 'peasants': {
        const max = count(P, 'brewery') ? 4 : 2;
        if (!(m.n >= 1 && m.n <= Math.min(max, S.bistro.length))) return `Bribe 1 to ${Math.min(max, S.bistro.length)} peasants.`;
        break;
      }
      case 'killPeasant': if (!S.bistro.length) return 'The bistro is empty.'; break;
      case 'build': {
        const id = buildCard(S, m);
        if (m.room != null) {
          if (!used.includes('wheelbarrow')) return 'Only the Wheelbarrow builds the annex of a traveler in a room.';
          if (!id) return 'That room is empty.';
          if (S.rooms[m.room].coffee != null) return 'That traveler has had his coffee.';
        } else {
          if (used.includes('wheelbarrow')) return 'The Wheelbarrow builds from a room: choose a traveler in the inn.';
          if (!P.hand.includes(m.card)) return 'Choose a card with an annex from your hand.';
          if (pay.includes(m.card)) return 'The annex card cannot pay for itself.';
        }
        if (!canAnnex(id)) return 'That traveler has no annex.';
        if (T(id).effect === 'trailer' && keysOf(S, p) >= MAX_KEYS) return 'You have no Key token left for a trailer.';
        break;
      }
      case 'bury': {
        if (!m.items || !m.items.length) return 'Choose a corpse.';
        if (m.items.length > 1 && !count(P, 'crypt')) return 'Only one corpse per action without the Crypt.';
        if (!uniq(m.items.map(it => it.id)) || !m.items.every(it => P.corpses.includes(it.id))) return 'Choose your own unburied corpses.';
        if (used.includes('quicklime') && !m.items.some(it => it.owner !== p)) return 'Quicklime is for a burial under another player\u2019s annex.';
        const done = [];
        for (const it of m.items) {
          if (!S.players[it.owner] || !S.players[it.owner].annexes[it.annex]) return 'Choose an annex.';
          if (!annexTargets(S, done, it.id, p).some(x => x.p === it.owner && x.i === it.annex)) {
            const sp = special(it.id);
            return sp === 'twins' ? 'The Twins need an annex with 2 free places.' : sp === 'lady' ? 'The Bearded Lady goes under another player\u2019s annex.' : 'That annex is full or occupied.';
          }
          done.push(it);
        }
        break;
      }
      default: return 'Unknown action.';
    }
    const c = cost(S, p, m);
    if (pay.length !== c) return `This costs ${c} accomplice${c === 1 ? '' : 's'}; ${pay.length} chosen.`;
    return '';
  }

  // ---------- applying a decision ----------
  function apply(S, m) {
    const err = check(S, m);
    if (err) throw new Error(err);
    const pd = S.pending, p = pd.p, P = S.players[p];
    S.pending = null;
    S.last = {p, m: structuredClone(m), round: S.round};
    switch (pd.t) {
      case 'draft':
        S.draft.hands[p].splice(S.draft.hands[p].indexOf(m.id), 1);
        P.objects.push(m.id);
        log(S, `${pname(S, p)} keeps an object.`, 'round', p);
        break;
      case 'objects':
        if (m.play) { playObj(S, p, m.play); S.queue.unshift({k: 'objwin', p, when: pd.when}); }
        break;
      case 'study':
        if (m.yes) { P.cash -= 10; P.checks++; log(S, `Study: ${pname(S, p)} also launders 10F into a check.`, 'pass', p); }
        break;
      case 'lodge': lodge(S, pd.card, m.room); break;
      case 'rs':
        S.rooms[m.room].rs = p;
        log(S, `${pname(S, p)} puts a Room Service token on room ${m.room + 1}.`, 'build', p, {room: m.room});
        break;
      case 'monk':
        S.rooms[m.room].key = p;
        log(S, `${pname(S, p)} claims room ${m.room + 1}.`, 'build', p, {room: m.room});
        break;
      case 'grave': payGrave(S, p, m.checks); break;
      case 'release': release(S, p, m.ids); break;
      case 'turn': action(S, p, m); break;
    }
    advance(S);
    return S;
  }

  function useObjs(S, p, list) {
    const P = S.players[p];
    for (const o of list) { P.objects.splice(P.objects.indexOf(o), 1); S.objUsed.push(o); }
    if (list.length) log(S, `${pname(S, p)} plays the ${list.map(o => OBJECTS[o].name).join(' and the ')}.`, 'object', p);
  }

  function playObj(S, p, pl) {
    const P = S.players[p], who = pname(S, p);

        case 'coffee': s = E.rank(g) * 1.5 + (S.rooms[o.room].key === p ? .5 : 0) - (last ? 0 : 2.5); break;
        case 'cake': s = 2 * E.rank(g) * (S.rooms[o.room].coffee === p ? 1 : .45) - (last ? 0 : 2.5); break;
        case 'poison': {
          const to = typeof S.rooms[o.room].key === 'number' ? S.rooms[o.room].key : p;
          if (to === p) s = freeSlots > 0 && !cops ? T(g).money * .45 - E.brank(g) - 2 : -1e9;
          else s = cops && !E.isPolice(g) ? 8 + T(g).money * .05 : -1e9;
          break;
        }
        case 'rug': s = o.to === leader && (cops || freeSlots < 0) ? 9 : -1e9; break;
        case 'letter': {
          const theirs = others.reduce((n, q) => n + E.payable(S.players[q]).length, 0);
          s = !E.payable(P).length && theirs >= 2 ? 3 * theirs : -1e9;
          break;
        }
        case 'snowpile': s = 10; break;
        case 'tomb': s = T(o.corpse).money / 2 + (o.owner === p ? 10 : 0) - (o.owner === p ? 0 : 3); break;
        case 'confessional': s = R < 3 || S.final ? 6 : -1e9; break;
      }
      if (s > bs) { bs = s; best = o; }
    }
    return {t: 'obj', play: best};
  }

  function minor(S) {
    const pd = S.pending, p = pd.p, P = S.players[p];
    switch (pd.t) {
      case 'draft': {
        const best = pd.opts.slice().sort((a, b) => (OBJ_WORTH[b] - 1.1 * OBJECTS[b].cost) - (OBJ_WORTH[a] - 1.1 * OBJECTS[a].cost) || (a < b ? -1 : 1))[0];
        return {t: 'draft', id: best};
      }
      case 'objects': return objectPlay(S, p, pd.when);
      case 'study': return {t: 'study', yes: P.cash >= 18};
      case 'lodge': {
        const id = pd.card, r = E.rank(id);
        let best = -1, bs = -1e9;
        S.rooms.forEach((R, i) => {
          if (R.key === null || R.guest) return;
          let s = 0;
          if (R.rs === p) s += r * 2; else if (R.rs !== null) s -= r;
          if (R.key === p) s += .5;
          if (s > bs) { bs = s; best = i; }
        });
        return {t: 'lodge', room: best};
      }
      case 'rs': {
        const doors = S.rooms.map((R, i) => R.key !== null && R.rs === null && !E.isTrailer(R) ? i : -1).filter(i => i >= 0);
        return {t: 'rs', room: doors.find(i => S.rooms[i].key === p) ?? doors[0]};
      }
      case 'monk': {
        const w = S.rooms.map((R, i) => R.key === 'white' ? i : -1).filter(i => i >= 0);
        return {t: 'monk', room: w.find(i => S.rooms[i].guest) ?? w[0]};
      }
      case 'grave': return {t: 'grave', checks: pd.lo};
      case 'release': {
        const h = P.hand.slice().sort((a, b) => (E.isPeasant(a) ? -1 : E.keepValue(S, p, a)) - (E.isPeasant(b) ? -1 : E.keepValue(S, p, b)) || (a < b ? -1 : 1));
        return {t: 'release', ids: h.slice(0, pd.k)};
      }
    }
    return null;
  }

  function settle(X, p) {
    // resolve p's own follow-up decisions (Room Service, Monk) so the evaluation sees the result
    let g = 0;
    while (X.pending && X.pending.p === p && X.pending.t !== 'turn' && X.pending.t !== 'lodge' && g++ < 5) E.apply(X, minor(X));
  }
  function scoreMove(S, p, m) {
    const X = clone(S);
    E.apply(X, m);
    settle(X, p);
    return value(X, p);
  }

  function normal(S, deadline = Infinity) {
    const p = S.pending.p, cs = candidates(S, p);
    let best = cs[0], bs = -1e9;
    for (const m of cs) {
      if (Date.now() >= deadline) break;
      const s = scoreMove(S, p, m); if (s > bs + 1e-9) { bs = s; best = m; }
    }
    return best || {t: 'pass', launder: 0};
  }

  function determinize(S, seed, p) {
    // hide what the AI cannot know: the entrance below its face-up top card mixed with the cards removed at setup,
    // the order of the event deck, and the other innkeepers' secret objects
    const X = clone(S);
    X.rng = seed >>> 0;
    if (X.entrance.length > 1) {
      const pool = E.shuffle(X, X.entrance.slice(1).concat(X.removed));
      X.entrance = [X.entrance[0], ...pool.slice(0, X.entrance.length - 1)];
      X.removed = pool.slice(X.entrance.length - 1);
    }
    if (X.ev) E.shuffle(X, X.ev.deck);
    X.players.forEach((P, q) => { if (q !== p) P.objects = []; });
    return X;
  }
  function playout(X, p, start, deadline = Infinity) {
    let g = 0;
    while (!X.over && X.pending && X.round === start && g++ < 80 && Date.now() < deadline) {
      const m = X.pending.t === 'turn' ? normal(X, deadline) : minor(X);
      E.apply(X, m);
    }
    return value(X, p);
  }
  function hard(S, deadline = Infinity) {
    const p = S.pending.p, cs = candidates(S, p);
    const ranked = cs.map(m => [m, scoreMove(S, p, m)]).sort((a, b) => b[1] - a[1]).slice(0, 8);
    let best = ranked.length ? ranked[0][0] : {t: 'pass', launder: 0}, bs = -1e9;
    for (const [m, s0] of ranked) {
      if (Date.now() >= deadline) break;
      let tot = 0;
      for (let k = 0; k < 2; k++) {
        if (Date.now() >= deadline) break;
        const X = determinize(S, S.seed * 31 + S.turnNo * 7 + k, p);
        E.apply(X, m); settle(X, p);
        tot += playout(X, p, S.round, deadline);
      }
      const s = tot / 2 + s0 * .25;
      if (s > bs) { bs = s; best = m; }
    }
    return best;
  }
  function easy(S, deadline = Infinity) {
    const p = S.pending.p, cs = candidates(S, p);
    const X = {rng: (S.seed ^ (S.turnNo * 2654435761)) >>> 0};
    const scored = [];
    for (const m of cs) {
      if (Date.now() >= deadline) break;
      scored.push([m, scoreMove(S, p, m) + (E.rnd(X) - .5) * 12]);
    }
    scored.sort((a, b) => b[1] - a[1]);
    if (!scored.length) return {t: 'pass', launder: 0};
    return scored[Math.floor(E.rnd(X) * Math.min(3, scored.length))][0];
  }

  function fallback(S) {
    if (!S.pending) return null;
    const m = S.pending.t === 'turn' ? {t: 'pass', launder: 0} : minor(S);
    return m && !E.check(S, m) ? m : null;
  }
  function decide(S, level, maxMs = 9000) {
    if (!S.pending) return null;
    if (S.pending.t !== 'turn') return minor(S);
    level = level || (S.seats[S.pending.p] || {}).level || 'normal';
    const deadline = Date.now() + Math.max(20, maxMs);
    const m = level === 'hard' ? hard(S, deadline) : level === 'easy' ? easy(S, deadline) : normal(S, deadline);
    return m && !E.check(S, m) ? m : fallback(S);
  }

  // Non-invasive hint about a rival's likely plan: only what is visible on the table (never their objects).
  function intel(S, q) {
    const P = S.players[q], notes = [];
    const cops = S.rooms.some(r => r.guest && E.isPolice(r.guest));
    if (P.corpses.length) notes.push(`${P.corpses.length} unburied corpse${P.corpses.length === 1 ? '' : 's'}${cops ? ' and the police are in the inn' : ''}`);
    const free = P.annexes.reduce((n, a) => n + Math.max(0, E.annexFree(a)), 0);
    if (free) notes.push(`${free} free burial slot${free === 1 ? '' : 's'}`);
    const kill = P.hand.filter(id => E.apt(id) === 'kill').length, bury = P.hand.filter(id => E.apt(id) === 'bury').length;
    if (kill) notes.push(`${kill} killer accomplice${kill === 1 ? '' : 's'} (cheap kills)`);
    if (bury) notes.push(`${bury} burying accomplice${bury === 1 ? '' : 's'} (cheap burials)`);
    const ends = P.annexes.filter(a => a.id !== 'barn' && END_COL[T(a.id).effect]).map(a => T(a.id).annex);
    if (ends.length) notes.push(`scores at the end with ${ends.join(', ')}`);
    if ((P.objects || []).length) notes.push(`${P.objects.length} secret object${P.objects.length === 1 ? '' : 's'} left`);
    return notes;
  }

  return {decide, fallback, normal, hard, easy, minor, candidates, value, estimate, intel, roundsLeft};
})();

    if (e && e.name === 'OperationError') { store.del('artkey'); toast('This art link is not valid for this version.'); }

function selCost() {

  if (sel.mode === 'build') return Engine.cost(S, p, sel.room != null ? {t: 'build', room: sel.room} : {t: 'build', card: sel.card});
  if (sel.mode === 'bury') return Engine.cost(S, p, {t: 'bury', items: sel.items});

}

  switch (sel.mode) {

    case 'build': return withObjs(sel.room != null ? {t: 'build', room: sel.room, pay: sel.pay} : {t: 'build', card: sel.card, pay: sel.pay});
    case 'bury': return withObjs({t: 'bury', items: sel.items.map(it => ({id: it.id, owner: it.owner, annex: it.annex})), pay: sel.pay});

      ${btns(opt(`${ICON.bribe} Bribe (${plural(cb, 'card')})`, 'bribe', 'primary', o.bribe.includes(sel.room) ? '' : 'Not enough cards in hand'),
        opt(`${ICON.kill} Kill (${plural(ck, 'card')})`, 'kill', '', o.kill.includes(sel.room) ? '' : 'Not enough cards in hand'), wheel, opt('Cancel', 'cancel', 'ghost'))}</div>`;
  }
  if (sel.mode === 'bistro') {
    const b = [];

    return `<div class="prompt"><div class="ptext"><b>The bistro</b> (${plural(S.bistro.length, 'peasant')}). Peasants are rank 0: bribing 1 or 2${Engine.count(P, 'brewery') ? ' (4 with your Brewery)' : ''} or killing one costs nothing. Remember their wages.</div>
      ${btns(...b, o.killPeasant ? opt(`${ICON.kill} Kill a peasant`, 'killpeas') : '', opt('Cancel', 'cancel', 'ghost'))}</div>`;
  }
  if (sel.mode === 'pass') {
    const k = sel.k || 0, maxBuy = Math.floor(P.cash / 10);
    return `<div class="prompt"><div class="ptext"><b>Pass.</b> You may launder money with the notary, in one direction: buy 10F checks with cash, or cash checks (cash is capped at 40F).</div>
      <div class="launder"><button data-a="opt" data-o="k-" ${k <= -P.checks ? 'disabled' : ''} aria-label="Fewer">\u2212</button><span>${k > 0 ? `Buy ${plural(k, 'check')} (\u2212${10 * k}F)` : k < 0 ? `Cash ${plural(-k, 'check')} (+${-10 * k}F${P.cash - 10 * k > 40 ? `, ${P.cash - 10 * k - 40}F lost over 40F` : ''})` : 'No laundering'}</span><button data-a="opt" data-o="k+" ${k >= maxBuy ? 'disabled' : ''} aria-label="More">+</button></div>

  const m = selMove(), need = selCost(), err = Engine.check(S, m), act = Engine.actionOf(m);
  let what = '';
  if (sel.mode === 'bribe' || sel.mode === 'kill') what = `${sel.mode === 'bribe' ? `${ICON.bribe} Bribe` : `${ICON.kill} Kill`} ${sel.rooms.map(i => `the <b>${esc(T(S.rooms[i].guest).name)}</b> (${esc(Engine.roomName(S, i))})`).join(' and ')}.${sel.multi ? ' <small>Tap more travelers to add them.</small>' : ''}`;

  }).join('');
  return `<div class="prompt"><div class="ptext">${what}<br><small>Pay ${plural(need, 'accomplice')}${need ? `: ${pay || '\u2014'}. Tap cards in your hand to change the payment (\u21A9 returns to hand: the action\u2019s aptitude).` : '.'}</small>

    ${btns(opt('Confirm', 'confirm', 'primary', err), opt('Cancel', 'cancel', 'ghost'))}</div>`;

function objLabel(S, p, pl) {
  const o = OBJECTS[pl.id], g = pl.room != null ? S.rooms[pl.room].guest : null, rn = pl.room != null ? Engine.roomName(S, pl.room) : '';
  switch (pl.id) {
    case 'coffee': return `${ICON.coffee} Coffee: ${esc(T(g).name)} (${esc(rn)}), +${T(g).rank}F`;
    case 'cake': return `${ICON.cake} Cake: ${esc(T(g).name)} (${esc(rn)}), +${2 * T(g).rank}F if he stays`;
    case 'poison': { const R = S.rooms[pl.room], to = typeof R.key === 'number' ? R.key : p; return `\u2620\uFE0F Poison the ${esc(T(g).name)} (${esc(rn)}): corpse to ${to === p ? 'you' : esc(pname(to))}`; }
    case 'rug': return `Rug: ${esc(T(pl.corpse).name)}\u2019s corpse to ${esc(pname(pl.to))}`;
    case 'letter': return `\u2709\uFE0F Letter of Denunciation`;
    case 'snowpile': return `${ICON.snow} Snow Pile over the ${esc(T(pl.corpse).name)}`;
    case 'tomb': return `\u{1FAA6} Tomb: ${pl.owner === p ? 'your' : esc(pname(pl.owner)) + '\u2019s'} ${esc(T(pl.corpse).name)}, +${T(pl.corpse).money / 2}F`;
    case 'confessional': return `Confessional: take 6F from the top burier`;
  }
  return esc(o.name);
}
function annexName(q, i) {
  const a = UI.S.players[q].annexes[i];

function destButtons() {
  const S = UI.S, sel = UI.sel, p = actor(S), cur = sel.items[sel.items.length - 1];
  return Engine.annexTargets(S, sel.items.slice(0, -1), cur.id, p).map(a => `<button data-a="dest" data-p="${a.p}" data-i="${a.i}" class="${cur.owner === a.p && cur.annex === a.i ? 'on' : ''}" style="--pc:${pcol(a.p)}">
    ${annexName(a.p, a.i)} <small>${a.free} free${a.p === p ? '' : ' \u00B7 split'}</small></button>`).join('');

function outcomeText(S, m, p) {
  const pv = Engine.preview(S, m); if (!pv) return '';
  const out = [];
  for (const d of pv) {
    const parts = [];
    if (d.cash) parts.push(`${d.cash > 0 ? '+' : '\u2212'}${Math.abs(d.cash)}F`);
    if (d.checks) parts.push(`${d.checks > 0 ? '+' : '\u2212'}${plural(Math.abs(d.checks), 'check')}`);
    if (d.p === p && d.hand) parts.push(`${d.hand > 0 ? '+' : '\u2212'}${plural(Math.abs(d.hand), 'card')} in hand`);
    if (parts.length) out.push(`${d.p === p ? (you(p) ? 'You' : esc(pname(p))) : esc(pname(d.p))}: ${parts.join(', ')}`);
  }
  const P = S.players[p];
  if (m.t === 'bribe') out.push(`${m.rooms.map(i => T(S.rooms[i].guest).name).join(' and ')} ${m.rooms.length > 1 ? 'join' : 'joins'} your hand (+1F wages each)`);
  if (m.t === 'build') { const bc = m.card || S.rooms[m.room].guest; out.push(`new ${T(bc).annex}, room for ${plural(T(bc).brank, 'corpse')}`); }
  if (m.t === 'kill' || m.t === 'killPeasant') out.push('a corpse to bury before the police come');
  if (P.cash + (pv[p].cash || 0) >= 40 && !S.opts.unlimited && (pv[p].cash || 0) > 0) out.push('cash capped at 40F');
  return out.join(' \u00B7 ') || 'no money changes hands';
}

function save() { if (!UI.auto && !UI.practice && UI.S && !Q.has('test') && !UI.freeze) store.set('save', {S: UI.S, viewer: UI.viewer, seasonSnap: UI.seasonSnap}); }
const STATS0 = () => ({games: 0, byLevel: {}, byN: {}, best: 0, sum: 0, streak: 0, bestStreak: 0, solo: {games: 0, best: 0, ratings: {}}, pnp: 0, recent: []});
function recordStats(S) {
  if (UI.auto || UI.practice || UI.freeze) return;
  const h = humans(); if (!h.length) return;
  const st = {...STATS0(), ...store.get('stats', {})}, R = S.result;
  st.games++;
  const g = {d: new Date().toISOString().slice(0, 10), n: S.n, long: S.opts.long, rounds: S.round};
  if (S.n === 1) {
    const tot = R.rows[0].total;
    st.solo.games++; st.solo.best = Math.max(st.solo.best, S.lost ? 0 : tot); st.solo.ratings[R.rating] = (st.solo.ratings[R.rating] || 0) + 1;
    Object.assign(g, {opp: 'solo', total: tot, r: S.lost ? 'l' : 'w', rating: R.rating});
  } else if (h.length > 1) { st.pnp++; Object.assign(g, {opp: 'pnp', winner: R.rows.filter(r => r.rank === 1).map(r => r.name).join(' & ')}); }
  else {
    const me = R.rows[h[0]], lv = S.seats.filter(s => s.type === 'ai').map(s => s.level), level = lv.every(l => l === lv[0]) ? lv[0] : 'mixed';
    const shared = R.rows.filter(r => r.rank === 1).length > 1, r = me.rank === 1 ? (shared ? 't' : 'w') : 'l';
    const o = st.byLevel[level] || (st.byLevel[level] = {w: 0, l: 0, t: 0}); o[r]++;
    const on = st.byN[S.n] || (st.byN[S.n] = {w: 0, l: 0, t: 0}); on[r]++;
    st.best = Math.max(st.best, me.total); st.sum += me.total;
    st.streak = r === 'w' ? st.streak + 1 : 0; st.bestStreak = Math.max(st.bestStreak, st.streak);
    Object.assign(g, {opp: level, total: me.total, place: me.rank, r});
  }
  st.recent = [g, ...st.recent].slice(0, 12);
  store.set('stats', st);
}
function showStats() {
  const st = {...STATS0(), ...store.get('stats', {})};
  const wlt = o => o ? `${o.w} won \u00B7 ${o.l} lost${o.t ? ` \u00B7 ${o.t} shared` : ''}` : '\u2014';
  const ai = Object.values(st.byLevel).reduce((a, o) => ({w: a.w + o.w, n: a.n + o.w + o.l + o.t}), {w: 0, n: 0});
  const rate = ai.n ? Math.round(ai.w / ai.n * 100) + '%' : '\u2014';
  const RN = {w: 'Won', l: 'Lost', t: 'Shared'};
  const recent = st.recent.map(g => `<tr><td>${esc(g.d)}</td><td>${g.opp === 'solo' ? 'Solo' : g.opp === 'pnp' ? `Pass and play, ${g.n} players` : `${g.n} players vs AI ${g.opp}`}</td>
    <td class="${g.r || ''}">${g.opp === 'solo' ? `${g.total}F ${esc(g.rating)}` : g.opp === 'pnp' ? esc(g.winner) + ' won' : `${RN[g.r]} (${ordinal(g.place)}, ${g.total}F)`}</td><td class="muted">${g.long ? 'long' : 'short'}, ${g.rounds} rounds</td></tr>`).join('');
  modal({title: 'Statistics', body: `<div class="kpis"><div><b>${st.games}</b>Games</div><div><b>${rate}</b>Win rate vs AI</div><div><b>${st.streak}</b>Current streak</div><div><b>${st.best}F</b>Best booty</div></div>
    <table class="res">${['easy', 'normal', 'hard', 'mixed'].filter(l => l !== 'mixed' || st.byLevel.mixed).map(l => `<tr><td>vs AI ${l}</td><td>${wlt(st.byLevel[l])}</td></tr>`).join('')}
    ${[2, 3, 4].map(n => `<tr><td>${n} players</td><td>${wlt(st.byN[n])}</td></tr>`).join('')}
    <tr><td>Average booty vs AI</td><td>${ai.n ? Math.round(st.sum / ai.n) + 'F' : '\u2014'} \u00B7 best streak ${st.bestStreak}</td></tr>
    <tr><td>Solo</td><td>${st.solo.games ? `${st.solo.games} games, best ${st.solo.best}F` : '\u2014'}</td></tr><tr><td>Pass and play</td><td>${plural(st.pnp, 'game')}</td></tr></table>
    ${recent ? `<h3 class="sh">Recent games</h3><table class="res recent">${recent}</table>` : ''}<p class="muted">Stored only in this browser. Practice games from the guided tour are not counted.</p>`,
  buttons: [{label: 'Reset', fn: () => { store.del('stats'); showStats(); }}]});
}

function selfplaySeats() {
  const sv = Q.get('seats') || '4', levels = (Q.get('levels') || 'normal').split(',');
  const n = sv === 'solo' ? 1 : +sv;
  return Array.from({length: n}, (_, i) => ({name: i ? AI_NAMES[i - 1] : 'You', type: i && Q.get('pnp') !== '1' ? 'ai' : 'human', level: levels[i % levels.length]}));
}
function runSelfplay() {
  const games = +(Q.get('n') || 1), seed0 = +(Q.get('seed') || 1000), long = Q.get('short') !== '1';
  let steps = 0, last = '';
  UI.auto = true;
  try {
    for (let g = 0; g < games; g++) {
      UI.S = Engine.newGame({seed: seed0 + g, long, seats: selfplaySeats(), unlimited: Q.get('unlimited') === '1', fcfs: Q.get('fcfs') === '1', mods: queryMods()}); UI.undo = []; UI.viewer = 0;
      let k = 0;
      while (!UI.S.over) {
        if (++k > 6000) throw new Error('stalled at seed ' + (seed0 + g));
        const p = actor(UI.S);
        if (pnp()) UI.viewer = p;
        const m = AI.decide(UI.S, seat(p).level);
        const err = Engine.check(UI.S, m);
        if (err) throw new Error(`illegal move ${JSON.stringify(m)}: ${err}`);
        commit(m, isHuman(p));
        if (k % 23 === 0) renderGame();
      }
      steps += k;
      last = UI.S.result.rows.map(r => r.total).join('/');
    }
    UI.auto = false; renderGame();
    document.title = `SELFPLAY DONE ${last} in ${steps} steps`;
  } catch (e) {
    UI.auto = false;
    document.title = `SELFPLAY ERROR ${e.message}`;
    $('#app').insertAdjacentHTML('afterbegin', `<pre class="testlist f">${esc(e.stack || e)}</pre>`);
  }
}
function runFreeze() {
  const o = {...defaultSetup(), n: Q.get('seats') === 'solo' ? 1 : +(Q.get('seats') || 4), opp: Q.get('opp') || 'normal', long: Q.get('short') !== '1', mods: queryMods()};
  startGame(o, +(Q.get('seed') || 7));
  clearTimeout(UI.timer);
  const turns = +(Q.get('turns') || 0);
  UI.auto = true;
  for (let k = 0; k < turns && !UI.S.over; k++) commit(AI.decide(UI.S, 'normal'), false);
  let g = 0;
  const want = Q.get('until') || 'turn';
  while (!UI.S.over && g++ < 3000 && (!isHuman(actor(UI.S)) || (want !== 'any' && UI.S.pending.t !== want) || (Q.has('end') && !UI.S.over))) commit(AI.decide(UI.S, 'normal'), false);
  UI.auto = false; UI.undo = [];
  if (Q.get('tab')) UI.tab = Q.get('tab');
  if (Q.has('sheet')) UI.sheetMin = Q.get('sheet') === 'min';
  renderGame();
  const pop = Q.get('popup');
  const S = UI.S, myP = S.pending && S.pending.p;
  if (pop === 'help') showHelp();
  if (pop === 'menu') showMenu();
  if (pop === 'keys') showKeys();
  if (pop === 'stats') { if (S.over) recordStats(S); showStats(); }
  if (pop === 'result' && S.over) showResult();
  if (pop === 'share' && S.over) showShare();
  if (pop === 'exit') showExit();
  if (pop === 'event') showEvent();
  if (pop === 'object' && S.players[viewer()].objects.length) showObject(S.players[viewer()].objects[0]);
  if (pop === 'objpick' && myTurn() && S.pending.t === 'objects') { const pl = Engine.objOptions(S, myP, S.pending.when); const multi = pl.find(x => pl.filter(y => y.id === x.id).length > 1); if (multi) onOpt('objpick:' + multi.id); }
  if (pop === 'board') showBoard();
  if (pop === 'player') showPlayer(1);
  if (pop === 'card') { const i = S.rooms.findIndex((R, k) => R.guest && tgtRoom(k)); if (i >= 0) onRoom(i, true); else { const j = S.rooms.findIndex(R => R.guest); if (j >= 0) showCard(S.rooms[j].guest); } }
  if (pop === 'season') { UI.seasonSnap = snap(S).map(x => ({...x, total: x.total - 12, annexes: Math.max(0, x.annexes - 1)})); showSeason(S); }
  if (pop === 'tour') { UI.freeze = false; tourStart(); UI.freeze = true; clearTimeout(UI.timer); tourGo(+(Q.get('tstep') || 1) - 1); }
  if (pop === 'choose' && myTurn()) { const o2 = Engine.options(S, myP), i = o2.kill.find(x => o2.bribe.includes(x)) ?? o2.bribe[0]; if (i !== undefined) onRoom(i); }
  if (pop === 'pay' && myTurn()) { const o2 = Engine.options(S, myP), i = o2.bribe.find(x => Engine.cost(S, myP, {t: 'bribe', rooms: [x]}) > 0) ?? o2.bribe[0]; if (i !== undefined) { onRoom(i); onOpt('bribe'); } }
  if (pop === 'build' && myTurn()) { const id = Engine.options(S, myP).build[0]; if (id) onHand(id); }
  if (pop === 'pass' && myTurn()) onOpt('pass');
  if (pop === 'cursor') { const el = cursorTargets()[+(Q.get('k') || 0)]; if (el) { UI.kcur = {a: el.dataset.a, v: el.dataset.i || el.dataset.id || ''}; renderGame(); } }
  if (pop === 'preview') { const el = $('.room.tgt'); if (el) { const r = el.getBoundingClientRect(); tipShow(el, r.left + r.width / 2, r.top + r.height / 2); el.classList.add('kcur'); } }
  document.title = `FROZEN round ${S.round} ${S.pending ? S.pending.t : 'over'}`;
}

// ?uitest: play whole games through DOM clicks only; each human move must equal the engine applying the same move.
async function runUiTest() {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const sortKeys = x => Array.isArray(x) ? x.map(sortKeys) : x && typeof x === 'object' ? Object.fromEntries(Object.keys(x).sort().map(k => [k, sortKeys(x[k])])) : x;
  const canon = x => JSON.stringify(sortKeys(x));
  let clicks = 0, moves = 0, last = '';
  const click = (el, what) => { if (!el) throw new Error('missing ' + what); el.dispatchEvent(new MouseEvent('click', {bubbles: true})); clicks++; };
  const room = i => $(`.room[data-i="${i}"]`), hand = id => $(`.tableau [data-a="hand"][data-id="${id}"]`), opt = o => $(`.prompt [data-o="${o}"]`);
  const fixPay = want => {
    for (const id of UI.sel.pay.filter(x => !want.includes(x))) click(hand(id), 'pay card ' + id);
    for (const id of want.filter(x => !UI.sel.pay.includes(x))) click(hand(id), 'pay card ' + id);
  };
  const toggles = m => { for (const o of (m.objs || []).filter(o => o !== 'wheelbarrow')) click(opt('tog:' + o), 'object ' + o); };
  async function play(m) {
    switch (m.t) {
      case 'draft': return click(opt('draft:' + m.id), 'draft ' + m.id);
      case 'study': return click(opt('study:' + (m.yes ? 1 : 0)), 'study');
      case 'obj': {
        if (!m.play) return click(opt('objdone'), 'carry on');
        const plays = Engine.objOptions(UI.S, UI.S.pending.p, UI.S.pending.when), k = plays.findIndex(pl => JSON.stringify(pl) === JSON.stringify(m.play));
        if (!opt('objp:' + k)) click(opt('objpick:' + m.play.id), 'object ' + m.play.id);
        return click(opt('objp:' + k), 'object play');
      }
      case 'lodge': case 'rs': case 'monk': return click(room(m.room), 'room ' + m.room);
      case 'grave': return click(opt('grave:' + m.checks), 'grave option');
      case 'release':
        for (const id of UI.sel.ids.filter(x => !m.ids.includes(x))) click(hand(id), 'release card');
        for (const id of m.ids.filter(x => !UI.sel.ids.includes(x))) click(hand(id), 'release card');
        return click(opt('release'), 'release button');
      case 'pass':
        click(opt('pass'), 'pass');
        for (let k = 0; k < Math.abs(m.launder || 0); k++) click(opt(m.launder > 0 ? 'k+' : 'k-'), 'launder');
        return click(opt('confirm'), 'confirm pass');
      case 'peasants': click($('.stack.bist'), 'bistro'); return click(opt('peas:' + m.n), 'peasants');
      case 'killPeasant': click($('.stack.bist'), 'bistro'); return click(opt('killpeas'), 'kill peasant');
      case 'bribe': case 'kill':
        click(room(m.rooms[0]), 'room'); click(opt(m.t), m.t);
        for (const r of m.rooms.slice(1)) click(room(r), 'extra room');
        toggles(m); fixPay(m.pay); return click(opt('confirm'), 'confirm');
      case 'build':
        if (m.room != null) { click(room(m.room), 'room'); click(opt('wheel'), 'wheelbarrow'); }
        else click(hand(m.card), 'build card');
        toggles(m); fixPay(m.pay); return click(opt('confirm'), 'confirm');
      case 'bury':
        m.items.forEach((it, k) => {
          click($(`.tableau [data-a="corpse"][data-id="${it.id}"]`), 'corpse');
          if (k === 0 || UI.sel.items.length === k + 1) click($(`.prompt [data-a="dest"][data-p="${it.owner}"][data-i="${it.annex}"]`), 'annex ' + it.owner + '/' + it.annex);
        });
        toggles(m); fixPay(m.pay); return click(opt('confirm'), 'confirm');
    }
    throw new Error('no UI path for ' + m.t);
  }
  UI.aiSpeed = 'fast'; UI.anim = false;
  try {
    for (let g = 0; g < +(Q.get('n') || 1); g++) {
      const n = Q.get('seats') === 'solo' ? 1 : +(Q.get('seats') || 3);
      startGame({...defaultSetup(), n, opp: Q.get('pnp') === '1' ? 'pnp' : 'normal', long: Q.get('short') !== '1', mods: queryMods()}, +(Q.get('seed') || 2000) + g);
      let guard = 0;
      while (!UI.S.over) {
        if (++guard > 20000) throw new Error('stalled');
        await wait(5);
        const cc = $('.chcard'); if (cc) { click(cc, 'season card'); continue; }
        const ps = $('#passok'); if (ps) { click(ps, 'pass device'); continue; }
        if (!myTurn()) continue;
        const before = UI.S, m = AI.decide(before, 'normal'), want = structuredClone(before);
        Engine.apply(want, m);
        await play(m);
        if (UI.S.done) want.done = true;
        if (UI.S === before) throw new Error('UI did not commit ' + JSON.stringify(m) + ' sel ' + JSON.stringify(UI.sel));
        if (canon(UI.S) !== canon(want)) {
          const diff = (a, b, path) => {
            if (JSON.stringify(a) === JSON.stringify(b)) return null;
            if (a && b && typeof a === 'object' && typeof b === 'object') for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) { const d = diff(a[k], b[k], path + '.' + k); if (d) return d; }
            return `${path}: ui ${JSON.stringify(a)} vs engine ${JSON.stringify(b)}`.slice(0, 300);
          };
          throw new Error('UI state differs after ' + JSON.stringify(m) + ' at ' + diff(UI.S, want, 'S'));
        }
        moves++;
      }
      await wait(1200); closeModal();
      last = UI.S.result.rows.map(r => r.total).join('/');
    }
    document.title = `UITEST DONE ${moves} moves ${clicks} clicks, last ${last}`;
  } catch (e) {
    document.title = `UITEST ERROR ${e.message}`.slice(0, 400);
    $('#app').insertAdjacentHTML('afterbegin', `<pre class="testlist f">${esc(e.stack || e)}</pre>`);
  }
}

function boot() {
  if (Q.has('uitest')) return runUiTest();
  if (Q.has('test')) return runTests();
  if (Q.has('selfplay')) return runSelfplay();
  if (UI.freeze) return runFreeze();
  landing();
}
boot();

</script>
